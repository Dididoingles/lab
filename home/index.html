<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Metatags de Compartilhamento (Open Graph / WhatsApp / Twitter) -->
    <meta property="og:title" content="Language Lab">
    <meta property="og:description" content="Um laboratório, dezenas de maneiras de aprender.">
    <meta property="og:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
    <meta property="og:url" content="https://dididoingles.github.io/lab/">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Language Lab">
    <meta name="twitter:description" content="Um laboratório, dezenas de maneiras de aprender.">
    <meta name="twitter:image" content="https://dididoingles.github.io/lab/assets/metalab.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <link rel="apple-touch-icon" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <title>Language Lab</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #222222; --paper: #ffffff;
            --accent: #c20000; --accent-dark: #a30000; --muted: #666666;
            --shadow-hard-sm: 2px 3px 0 rgba(34,34,34,.85);
            --font-title: 'Poppins', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-hand: 'Gochi Hand', cursive;
            --sidebar-width: 260px; --sidebar-collapsed: 80px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--paper); font-family: var(--font-title); color: var(--ink);
            overflow: hidden; height: 100vh; display: flex;
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================
           ANIMAÇÃO DE ENTRADA DO SHELL
           ========================================= */
        @keyframes shellFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar {
            animation: shellFadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .main-wrapper {
            animation: shellFadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
            opacity: 0; /* Começa invisível para a animação pegar */
        }

        /* Sidebar Base */
        .sidebar { width: var(--sidebar-width); height: 100vh; border-right: 1px solid rgba(34,34,34,.06); display: flex; flex-direction: column; padding: 24px 18px; background: var(--paper); z-index: 65; transition: width .3s cubic-bezier(.2,.8,.2,1), left .3s cubic-bezier(.2,.8,.2,1); position: relative; flex-shrink: 0; }
        .sidebar.sidebar--collapsed { width: var(--sidebar-collapsed); }
        .sidebar-close { background: none; border: none; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--muted); margin-bottom: 24px; font-size: 16px; flex-shrink: 0; transition: .2s; }
        .sidebar-close:hover { background: #f5f5f5; color: var(--accent); }
        .sidebar.sidebar--collapsed .sidebar-close i { transform: rotate(180deg); }
        .sidebar-close i { transition: transform .3s; }
        .sidebar-logo { font-family: var(--font-title); font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -.05em; margin-bottom: 32px; text-decoration: none; white-space: nowrap; overflow: hidden; transition: opacity .3s; }
        .sidebar-logo span { color: var(--ink); }
        .sidebar.sidebar--collapsed .sidebar-logo { opacity: 0; pointer-events: none; }

    
        .nav-menu { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; transition: .2s; }
        .nav-item i { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }
        .nav-item:hover { background: #f5f5f5; color: var(--ink); }
        .nav-item.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(194,0,0,.25); }
        .sidebar.sidebar--collapsed .nav-text { display: none; }
        .sidebar.sidebar--collapsed .nav-item { justify-content: center; padding: 12px 0; }
        .sidebar.sidebar--collapsed .sidebar-footer { opacity: 0; }
        .sidebar-footer { margin-top: auto; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; transition: opacity .3s; font-weight: 300; }
        .sidebar-footer p { margin-bottom: 4px; }

        /* Main + iframe */
        .main-wrapper { flex: 1; height: 100vh; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .bg-dee { position: absolute; right: -50px; bottom: 0; width: 100%; max-width: 600px; opacity: 0.5; z-index: 1; pointer-events: none; }

        #app-frame-wrap {
            position: relative; z-index: 5;
            flex: 1; width: 100%; height: 100%;
            overflow: hidden;
        }
        
        /* Animação no iframe para transição entre páginas */
        #view-frame {
            display: block;
            width: 100%; height: 100%;
            border: 0;
            background: transparent;
            transition: opacity 0.4s ease-out;
            opacity: 1;
        }

        /* Logo container */
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px; /* Espaço entre a imagem e o texto */
            text-decoration: none;
            margin-bottom: 32px;
            white-space: nowrap; /* Impede de quebrar linha */
            overflow: hidden;
            transition: opacity .3s;
        }

        /* Texto do Logo (o span externo) */
        .sidebar-logo > span {
            display: inline-block; /* Impede o flex de esticar o texto */
            font-family: var(--font-title);
            font-size: 22px;
            font-weight: 700;
            color: var(--accent); /* Vermelho para "Language" */
            letter-spacing: -.05em;
            line-height: 1;
            flex-shrink: 0; /* Impede que o texto seja esmagado */
        }

        /* A palavra "Lab" (o span interno) */
        .sidebar-logo .logo-highlight {
            display: inline-block;
            color: var(--ink); /* Preto para "Lab" */
            font-weight: 700;
        }

        /* Mars */
        .mars-drawer {
            width: 35px; 
            height: 35px;
            object-fit: contain;
            transition: transform .3s;
            flex-shrink: 0; /* Impede a imagem de ser esmagada */
        }

        .mars-drawer:hover {
            transform: translateY(0px) scale(1.1) rotate(-5deg);
        }
        .mars-assistant { position: absolute; right: 40px; top: 40px; width: 80px; height: 80px; z-index: 30; cursor: pointer; transition: transform .3s; }
        .mars-assistant:hover { transform: scale(1.1) rotate(5deg); }
        .mars-assistant img { position: absolute; width: 100%; }
        .mars-assistant .sketch { z-index: 1; }
        .mars-assistant .mars { z-index: 2; opacity: 0; transition: opacity .8s; }
        .mars-tooltip { position: absolute; right: 130px; top: 50px; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 16px; width: 260px; box-shadow: var(--shadow-hard-sm); z-index: 35; font-family: var(--font-hand); font-size: 16px; line-height: 1.4; color: var(--ink); opacity: 0; visibility: hidden; transform: translateX(20px); transition: all .3s cubic-bezier(.2,.8,.2,1); }
        .mars-tooltip::after { content: ''; position: absolute; right: -10px; top: 25px; border-left: 10px solid var(--ink); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
        .mars-tooltip::before { content: ''; position: absolute; right: -8px; top: 26px; border-left: 9px solid var(--paper); border-top: 9px solid transparent; border-bottom: 9px solid transparent; z-index: 1; }
        .mars-tooltip.show { opacity: 1; visibility: visible; transform: translateX(0); }
        .tooltip-close { position: absolute; top: 6px; right: 12px; cursor: pointer; font-weight: bold; color: #999; }

        /* width */
::-webkit-scrollbar {
width: 5px;
}

/* Track */
::-webkit-scrollbar-track {
background: #f1f1f12d;
}

/* Handle */
::-webkit-scrollbar-thumb {
background: #8888882a;
}

/* Handle on hover */
::-webkit-scrollbar-thumb:hover {
background: #555;
}

        /* Mobile */
        .sidebar-open-btn { display: none; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; opacity: 0; visibility: hidden; transition: .3s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        @media (max-width: 1024px) {
            .sidebar { position: fixed; top: 0; left: -100%; width: var(--sidebar-width) !important; height: 100vh; box-shadow: 10px 0 30px rgba(0,0,0,.05); z-index: 65; }
            .sidebar.sidebar--open { left: 0; }
            .sidebar .sidebar-logo, .sidebar .nav-text, .sidebar .sidebar-footer { opacity: 1 !important; pointer-events: auto !important; display: inline !important; }
            .sidebar .nav-item { justify-content: flex-start !important; padding: 12px 14px !important; }
            .sidebar .sidebar-close i { transform: rotate(0deg) !important; }
            .sidebar-open-btn { display: flex; position: fixed; top: 24px; left: 0; z-index: 55; background: var(--paper); border: 1px solid rgba(34,34,34,.1); border-left: none; box-shadow: 2px 2px 8px rgba(0,0,0,.06); width: 34px; height: 48px; border-radius: 0 10px 10px 0; color: var(--accent); opacity: .9; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
            .mars-assistant { right: 20px; top: 20px; width: 60px; height: 60px; }
            .mars-tooltip { right: 90px; top: 16px; width: 220px; font-size: 14px; padding: 12px; }
            .bg-dee { position: absolute; right: -50px; bottom: 0; width: 100%; max-width: 300px; opacity: 0.3; z-index: 1; pointer-events: none; }
             /* Logo container */
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px; /* Espaço entre a imagem e o texto */
            text-decoration: none;
            margin-bottom: 32px;
            white-space: nowrap; /* Impede de quebrar linha */
            overflow: hidden;
            transition: opacity .3s;
        }

        /* Texto do Logo (o span externo) */
        .sidebar-logo > span {
            display: inline-block; /* Impede o flex de esticar o texto */
            font-family: var(--font-title);
            font-size: 22px;
            font-weight: 700;
            color: var(--accent); /* Vermelho para "Language" */
            letter-spacing: -.05em;
            line-height: 1;
            flex-shrink: 0; /* Impede que o texto seja esmagado */
        }

        /* A palavra "Lab" (o span interno) */
        .sidebar-logo .logo-highlight {
            display: inline-block;
            color: var(--ink); /* Preto para "Lab" */
            font-weight: 700;
        }

        /* Mars */
        .mars-drawer {
            width: 32px; 
            height: 32px;
            object-fit: contain;
            transition: transform .3s;
            transform: translateY(7px); /* Seu ajuste fino */
            flex-shrink: 0; /* Impede a imagem de ser esmagada */
        }

        .mars-drawer:hover {
            transform: translateY(7px) scale(1.1) rotate(-5deg);
        }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <button class="sidebar-open-btn" id="sidebar-open-btn" aria-label="Abrir menu">
        <i class="fa-solid fa-bars-staggered"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <a href="#" class="sidebar-logo" data-route="start"> 
            <img src="../assets/mars.webp" class="mars-drawer" alt="Mascote">
            <span>Language <span class="logo-highlight">Lab</span></span>
        </a>
        <nav class="nav-menu">
            <a class="nav-item active" data-route="start"><i class="fa-solid fa-house"></i><span class="nav-text">Início</span></a>
            <a class="nav-item" data-route="tools"><i class="fa-solid fa-flask"></i><span class="nav-text">Laboratórios</span></a>
            <a class="nav-item" data-route="profile"><i class="fa-solid fa-user"></i><span class="nav-text">Exclusivos</span></a>
        </nav>
        <div class="sidebar-footer">
            <p>Idioma: <strong>PT-BR</strong></p>
            <p>© 2024 Language Lab</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <img src="../assets/maps.webp" alt="" class="bg-dee">
        <div class="mars-assistant" id="mars-btn">
            <img src="../assets/sketch.webp" class="sketch" alt="">
            <img src="../assets/mars.webp" class="mars" alt="">
        </div>
        <div class="mars-tooltip" id="mars-tooltip">
            <span class="tooltip-close" id="mars-close">×</span>
            <p id="mars-message">Olá! Eu sou o Mars.</p>
        </div>

        <main id="app-frame-wrap">
            <iframe id="view-frame" title="Conteúdo" src=""></iframe>
        </main>
    </div>

    <script>
        (function () {
            const iframe    = document.getElementById('view-frame');
            const sidebar   = document.getElementById('sidebar');
            const overlay   = document.getElementById('sidebar-overlay');
            const tooltip   = document.getElementById('mars-tooltip');
            const messageEl = document.getElementById('mars-message');
    
            let currentRoute = null;
            let isFirstLoad = true;
    
            const marsMessages = {
                start:   'Olá! Eu sou o Mars!',
                tools:   'Aqui estão todas as nossas ferramentas!',
                profile: 'Aqui é só para quem é aluno.'
            };
    
            function toggleSidebar() {
                if (window.innerWidth <= 1024) {
                    sidebar.classList.toggle('sidebar--open');
                    overlay.classList.toggle('active');
                } else {
                    sidebar.classList.toggle('sidebar--collapsed');
                }
            }
    
            function routeFromHash() {
                const hash = window.location.hash.replace(/^#\/?/, '');
                return hash || 'start';
            }
    
            // Evento que dispara assim que o iframe TERMINA de carregar a página nova
            iframe.addEventListener('load', () => {
                if (isFirstLoad) {
                    iframe.style.opacity = '1';
                    isFirstLoad = false;
                } else {
                    // Espera 50ms para garantir que o navegador renderizou o conteúdo, depois faz o fade-in
                    setTimeout(() => {
                        iframe.style.opacity = '1';
                    }, 50);
                }
            });
    
            function navigateTo(route, updateUrl = true) {
                if (!route || route === currentRoute) return;
                currentRoute = route;
    
                if (updateUrl) {
                    history.pushState({ route }, '', '#/' + route);
                }
    
                // 1. Esconde o iframe atual suavemente
                iframe.style.opacity = '0';
                
                // 2. Espera o fade-out terminar antes de trocar o src
                setTimeout(() => {
                    iframe.src = 'views/' + route + '/index.html';
                }, 200);
    
                document.querySelectorAll('.nav-item').forEach(link => {
                    link.classList.toggle('active', link.dataset.route === route);
                });
    
                if (marsMessages[route]) messageEl.textContent = marsMessages[route];
    
                if (window.innerWidth <= 1024) {
                    sidebar.classList.remove('sidebar--open');
                    overlay.classList.remove('active');
                }
            }
    
            window.addEventListener('popstate', () => {
                navigateTo(routeFromHash(), false);
            });

            window.addEventListener('message', (event) => {
    if (event.data && event.data.action === 'navigate') {
        // Força a atualização se a rota for diferente da atual
        if (event.data.route !== currentRoute) {
            navigateTo(event.data.route);
        }
    }
});
    
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('sidebar-close').addEventListener('click', toggleSidebar);
                document.getElementById('sidebar-open-btn').addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', toggleSidebar);
    
                document.querySelectorAll('[data-route]').forEach(el => {
                    el.addEventListener('click', e => {
                        e.preventDefault();
                        navigateTo(el.dataset.route);
                    });
                });
    
                document.getElementById('mars-btn').addEventListener('click', () => {
                    tooltip.classList.toggle('show');
                });
                document.getElementById('mars-close').addEventListener('click', () => {
                    tooltip.classList.remove('show');
                });
    
                setTimeout(() => {
                    const m = document.querySelector('.mars-assistant .mars');
                    if (m) m.style.opacity = '1';
                }, 800);
    
                // Inicia o app
                setTimeout(() => {
                    navigateTo(routeFromHash(), false);
                }, 150);
            });
        })();
        </script>

</body>
</html>
