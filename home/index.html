<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta property="og:title" content="Language Lab">
    <meta property="og:description" content="Um laboratório, dezenas de maneiras de aprender.">
    <meta property="og:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
    <meta property="og:url" content="https://dididoingles.github.io/lab/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Language Lab">
    <meta name="twitter:description" content="Um laboratório, dezenas de maneiras de aprender.">
    <meta name="twitter:image" content="https://dididoingles.github.io/lab/assets/metalab.png">

    <link rel="icon" type="image/png" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <link rel="apple-touch-icon" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <title>Language Lab</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #222222; --paper: #ffffff;
            --accent: #c20000; --accent-dark: #a30000; --muted: #666666;
            --shadow-hard-sm: 2px 3px 0 rgba(34,34,34,.85);
            --font-title: 'Poppins', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-hand: 'Gochi Hand', cursive;
            --sidebar-width: 260px; --sidebar-collapsed: 80px;
            --mobile-nav-h: 64px;
            --mobile-safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--paper); font-family: var(--font-title); color: var(--ink);
            overflow: hidden; height: 100vh; display: flex;
            -webkit-tap-highlight-color: transparent;
            background-image:
                linear-gradient(rgba(34, 34, 34, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 34, 34, 0.035) 1px, transparent 1px);
            background-size: 28px 28px;
            background-position: -1px -1px;
        }

        /* =========================================
           ANIMAÇÃO DE ENTRADA DO SHELL
           ========================================= */
        @keyframes shellFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar {
            animation: shellFadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .main-wrapper {
            opacity: 1;
            flex: 1; height: 100vh; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Sidebar Base */
        .sidebar { width: var(--sidebar-width); height: 100vh; border-right: 1px solid rgba(34,34,34,.06); display: flex; flex-direction: column; padding: 24px 18px; background: var(--paper); z-index: 65; transition: width .3s cubic-bezier(.2,.8,.2,1), left .3s cubic-bezier(.2,.8,.2,1); position: relative; flex-shrink: 0; }
        .sidebar.sidebar--collapsed { width: var(--sidebar-collapsed); }
        .sidebar-close { background: none; border: none; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--muted); margin-bottom: 24px; font-size: 16px; flex-shrink: 0; transition: .2s; }
        .sidebar-close:hover { background: #f5f5f5; color: var(--accent); }
        .sidebar.sidebar--collapsed .sidebar-close i { transform: rotate(180deg); }
        .sidebar-close i { transition: transform .3s; }
        .sidebar.sidebar--collapsed .sidebar-logo { opacity: 0; pointer-events: none; }

        .nav-menu { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; transition: .2s; }
        .nav-item i { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }
        .nav-item:hover { background: #f5f5f5; color: var(--ink); }
        .nav-item.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(194,0,0,.25); }
        .sidebar.sidebar--collapsed .nav-text { display: none; }
        .sidebar.sidebar--collapsed .nav-item { justify-content: center; padding: 12px 0; }
        .sidebar.sidebar--collapsed .sidebar-footer { opacity: 0; }
        .sidebar-footer { margin-top: auto; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; transition: opacity .3s; font-weight: 300; }
        .sidebar-footer p { margin-bottom: 4px; }

        .bg-dee { position: absolute; right: -50px; bottom: 0; width: 30%; max-width: 400px; opacity: 0.5; z-index: 1; pointer-events: none; }

        #app-frame-wrap {
            position: relative; z-index: 5;
            flex: 1; width: 100%; height: 100%;
            overflow: hidden;
        }

        #view-frame {
            display: block;
            width: 100%; height: 100%;
            border: 0;
            background: transparent;
            transition: opacity 0.2s ease-out;
        }

        /* =========================================
           NOVO: SKELETON LOADER (overlay do iframe)
           ========================================= */
        .skeleton-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;                /* acima do iframe, abaixo do Mars (30) */
            padding: 40px;
            background: var(--paper);
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 1;
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }
        .skeleton-overlay.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .sk-block {
            background: linear-gradient(
                90deg,
                rgba(34,34,34,.05) 0%,
                rgba(34,34,34,.10) 50%,
                rgba(34,34,34,.05) 100%
            );
            background-size: 200% 100%;
            border-radius: 10px;
            animation: skShimmer 1.4s ease-in-out infinite;
        }

        @keyframes skShimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sk-title {
            height: 32px;
            width: 45%;
            max-width: 320px;
            border-radius: 8px;
        }
        .sk-subtitle {
            height: 14px;
            width: 65%;
            max-width: 420px;
        }
        .sk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .sk-card {
            height: 140px;
            border-radius: 14px;
        }
        .sk-line { height: 12px; width: 100%; }
        .sk-line--short { width: 70%; }
        .sk-line--shorter { width: 40%; }

        @media (prefers-reduced-motion: reduce) {
            .sk-block { animation: none; }
        }

        @media (max-width: 1024px) {
            .skeleton-overlay { padding: 24px 16px; gap: 14px; }
            .sk-title { height: 26px; width: 55%; }
            .sk-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .sk-card { height: 110px; }
        }
        /* FIM NOVO: SKELETON */

        /* Logo container */
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 32px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity .3s;
        }

        .sidebar-logo > span {
            display: inline-block;
            font-family: var(--font-title);
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -.05em;
            line-height: 1;
            flex-shrink: 0;
        }

        .sidebar-logo .logo-highlight {
            display: inline-block;
            color: var(--ink);
            font-weight: 700;
        }

        .mars-drawer {
            width: 35px;
            height: 35px;
            object-fit: contain;
            transition: transform .3s;
            flex-shrink: 0;
        }

        .mars-drawer:hover {
            transform: translateY(0px) scale(1.1) rotate(-5deg);
        }

        /* =========================================
           MARS ASSISTANT + SLIDE-IN + FLOAT + GLOW
           ========================================= */
        @keyframes marsSlideIn {
            0% {
                opacity: 0;
                transform: translate(120px, -60px) scale(0.7) rotate(15deg);
            }
            60% {
                opacity: 1;
                transform: translate(-8px, 4px) scale(1.05) rotate(-3deg);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }

        @keyframes marsFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        @keyframes marsGlowPulse {
            0%, 100% { opacity: .35; transform: scale(1); }
            50%      { opacity: .65; transform: scale(1.15); }
        }

        .mars-assistant {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 80px;
            height: 80px;
            z-index: 30;
            cursor: pointer;
            transition: transform .3s;
            animation: marsSlideIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
            isolation: isolate;
        }

        .mars-assistant::before {
            content: '';
            position: absolute;
            inset: -18%;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                rgba(194, 0, 0, 0.55) 0%,
                rgba(194, 0, 0, 0.28) 45%,
                rgba(194, 0, 0, 0) 72%);
            filter: blur(8px);
            z-index: -1;
            pointer-events: none;
            animation: marsGlowPulse 3.2s ease-in-out infinite;
        }

        .mars-assistant:hover { transform: scale(1.1) rotate(5deg); }

        .mars-assistant img {
            position: absolute;
            width: 100%;
            animation: marsFloat 3.4s ease-in-out infinite;
            will-change: transform;
        }

        @media (prefers-reduced-motion: reduce) {
            .mars-assistant,
            .mars-assistant::before,
            .mars-assistant img { animation: none !important; }
        }

        .mars-tooltip {
            position: absolute;
            right: 130px; top: 50px;
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 16px;
            width: 300px;
            max-width: calc(100vw - 32px);
            overflow-wrap: anywhere;
            word-break: break-word;
            box-shadow: var(--shadow-hard-sm);
            z-index: 35;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.45;
            color: var(--ink);
            opacity: 0; visibility: hidden;
            transform: translateX(20px);
            transition: all .3s cubic-bezier(.2,.8,.2,1);
        }
        .mars-tooltip::after { content: ''; position: absolute; right: -10px; top: 25px; border-left: 10px solid var(--ink); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
        .mars-tooltip::before { content: ''; position: absolute; right: -8px; top: 26px; border-left: 9px solid var(--paper); border-top: 9px solid transparent; border-bottom: 9px solid transparent; z-index: 1; }
        .mars-tooltip.show { opacity: 1; visibility: visible; transform: translateX(0); }
        .tooltip-close { position: absolute; top: 6px; right: 12px; cursor: pointer; font-weight: bold; color: #999; }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed rgba(194,0,0,.5);
            transition: color .15s, border-color .15s;
        }
        .footer-link:hover {
            color: var(--accent-dark);
            border-bottom-color: var(--accent-dark);
        }

        /* =========================================
           BOTÃO VOLTAR
           ========================================= */
        .shell-back-btn {
            position: absolute;
            right: 130px;
            top: 52px;
            width: 44px;
            height: 44px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            border: 1.5px solid rgba(34,34,34,0.10);
            border-radius: 12px;
            color: var(--ink);
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s ease, background 0.2s ease, transform 0.15s ease, border-color 0.2s ease, opacity 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .shell-back-btn:hover {
            color: var(--accent);
            background: rgba(194,0,0,0.05);
            border-color: rgba(194,0,0,0.25);
        }
        .shell-back-btn:active { transform: translateX(-2px); }
        .shell-back-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .shell-back-btn:disabled:hover { color: var(--ink); background: var(--paper); border-color: rgba(34,34,34,0.10); }

        /* =========================================
           MOBILE NAV BAR (bottom)
           ========================================= */
        .mobile-nav {
            display: none;
            position: fixed;
            left: 0; right: 0;
            bottom: 0;
            z-index: 70;
            height: calc(var(--mobile-nav-h) + var(--mobile-safe-bottom));
            padding: 0 8px var(--mobile-safe-bottom);
            background: rgba(255, 255, 255, 0.82);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            backdrop-filter: saturate(180%) blur(14px);
            border-top: 1px solid rgba(34,34,34,0.08);
            box-shadow: 0 -6px 24px rgba(34,34,34,0.06);
        }

        .mobile-nav__inner {
            position: relative;
            height: var(--mobile-nav-h);
            display: flex;
            align-items: stretch;
            justify-content: space-around;
            overflow: hidden;
        }

        .mobile-nav__item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .01em;
            cursor: pointer;
            border-radius: 12px;
            padding: 6px 2px;
            transition: color .2s, background .2s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 2;
        }

        .mobile-nav__item i {
            font-size: 19px;
            line-height: 1;
        }

        .mobile-nav__item span {
            font-size: 10px;
            line-height: 1;
            white-space: nowrap;
        }

        .mobile-nav__item:hover { color: var(--ink); }

        .mobile-nav__item.active { color: var(--accent); }

        .mobile-nav__thumb {
            position: absolute;
            top: 2px;
            left: 0;
            width: calc(100% / 5);
            height: 3px;
            border-radius: 2px;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(194, 0, 0, 0.35);
            transform: translateX(calc(var(--idx, 0) * 100%));
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            will-change: transform;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .mobile-nav__thumb { transition: none; }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f12d; }
        ::-webkit-scrollbar-thumb { background: #8888882a; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* =========================================
           SIDEBAR DESKTOP FLUTUANTE
           ========================================= */
        @media (min-width: 1025px) {
            .sidebar {
                margin: 16px 0 16px 16px;
                height: calc(100vh - 32px);
                border: 1px solid rgba(34,34,34,.08);
                border-right: 1px solid rgba(34,34,34,.08);
                border-radius: 18px;
                box-shadow: 0 10px 40px rgba(34,34,34,.2),
                            0 2px 8px rgba(34,34,34,.04);
                overflow-y: auto;
                overflow-x: hidden;
            }
            .sidebar.sidebar--collapsed { border-radius: 18px; }
        }

        /* =========================================
           MOBILE (<= 1024px): sidebar oculta, bottom nav ativa
           ========================================= */
        @media (max-width: 1024px) {
            .sidebar { display: none !important; }

            .mobile-nav { display: block; }

            .main-wrapper {
                height: 100vh;
                height: 100dvh;
            }
            #app-frame-wrap {
                height: calc(100% - var(--mobile-nav-h) - var(--mobile-safe-bottom));
            }

            .mars-assistant { right: 20px; top: 20px; width: 60px; height: 60px; }

            .mars-tooltip {
                left: 16px;
                right: 16px;
                top: 24px;
                width: auto;
                max-width: none;
                max-height: calc(100dvh - 24px - 16px - var(--mobile-nav-h) - var(--mobile-safe-bottom));
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                font-size: 12px;
                padding: 12px 14px;
                line-height: 1.4;
                transform: translateY(-8px);
            }
            .mars-tooltip.show { transform: translateY(0); }

            .mars-tooltip::after {
                right: 20px;
                top: -10px;
                left: auto;
                border-left: 10px solid transparent;
                border-right: 10px solid transparent;
                border-top: none;
                border-bottom: 10px solid var(--ink);
            }
            .mars-tooltip::before {
                right: 21px;
                top: -8px;
                left: auto;
                border-left: 9px solid transparent;
                border-right: 9px solid transparent;
                border-top: none;
                border-bottom: 9px solid var(--paper);
                z-index: 1;
            }

            .bg-dee { position: absolute; right: -50px; bottom: 0; width: 60%; max-width: 300px; opacity: 0.3; z-index: 1; pointer-events: none; }

            .shell-back-btn {
                left: 16px;
                right: auto;
                top: 20px;
                width: 40px;
                height: 40px;
                font-size: 14px;
            }

            .sidebar-logo > span { font-size: 22px; }
            .mars-drawer { width: 32px; height: 32px; transform: translateY(7px); }
            .mars-drawer:hover { transform: translateY(7px) scale(1.1) rotate(-5deg); }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <a href="#" class="sidebar-logo" data-route="start">
            <img src="../assets/labicon.webp" class="mars-drawer" alt="Mascote">
            <span>Language <span class="logo-highlight">Lab</span></span>
        </a>
        <nav class="nav-menu">
            <a class="nav-item active" data-route="start"><i class="fa-solid fa-house"></i><span class="nav-text">Início</span></a>
            <a class="nav-item" data-route="tools"><i class="fa-solid fa-flask"></i><span class="nav-text">Laboratórios</span></a>
            <a class="nav-item" data-route="profile"><i class="fa-solid fa-lock"></i><span class="nav-text">Exclusivos</span></a>
            <a class="nav-item" data-route="biblioteca"><i class="fa-solid fa-book-skull"></i><span class="nav-text">Biblioteca</span></a>
            <a class="nav-item" data-route="teacher"><i class="fa-solid fa-user"></i><span class="nav-text">Sobre a teacher</span></a>
        </nav>
        <div class="sidebar-footer">
            <p>Desenvolvido por <strong>@dicarvalho.prof</strong></p>
            <p>© 2024 Language Lab</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <img src="../assets/corner.webp" alt="" class="bg-dee">

        <button class="shell-back-btn" id="shell-back-btn" aria-label="Voltar" title="Voltar" disabled>
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="mars-assistant" id="mars-btn">
            <img src="../assets/mars.png" alt="Mars">
        </div>
        <div class="mars-tooltip" id="mars-tooltip">
            <span class="tooltip-close" id="mars-close">×</span>
            <p id="mars-message">Olá! Eu sou o Mars.</p>
        </div>

        <main id="app-frame-wrap">
            <iframe id="view-frame" title="Conteúdo" src=""></iframe>

            <!-- NOVO: SKELETON OVERLAY — começa escondido, só aparece via JS após delay -->
            <div class="skeleton-overlay is-hidden" id="skeleton-overlay" aria-hidden="true">
                <div class="sk-block sk-title"></div>
                <div class="sk-block sk-subtitle"></div>
                <div class="sk-grid">
                    <div class="sk-block sk-card"></div>
                    <div class="sk-block sk-card"></div>
                    <div class="sk-block sk-card"></div>
                    <div class="sk-block sk-card"></div>
                    <div class="sk-block sk-card"></div>
                    <div class="sk-block sk-card"></div>
                </div>
                <div class="sk-block sk-line"></div>
                <div class="sk-block sk-line sk-line--short"></div>
                <div class="sk-block sk-line sk-line--shorter"></div>
            </div>
            <!-- FIM NOVO: SKELETON OVERLAY -->
        </main>
    </div>

    <!-- Bottom nav (mobile only) -->
    <nav class="mobile-nav" id="mobile-nav" aria-label="Navegação principal">
        <div class="mobile-nav__inner">
            <span class="mobile-nav__thumb" id="mobile-nav-thumb" aria-hidden="true"></span>
            <a class="mobile-nav__item active" data-route="start"><i class="fa-solid fa-house"></i><span>Início</span></a>
            <a class="mobile-nav__item" data-route="tools"><i class="fa-solid fa-flask"></i><span>Labs</span></a>
            <a class="mobile-nav__item" data-route="profile"><i class="fa-solid fa-lock"></i><span>Exclusivos</span></a>
            <a class="mobile-nav__item" data-route="biblioteca"><i class="fa-solid fa-book-skull"></i><span>Biblioteca</span></a>
            <a class="mobile-nav__item" data-route="teacher"><i class="fa-solid fa-user"></i><span>Teacher</span></a>
        </div>
    </nav>

    <script>
        (function () {
            const iframe    = document.getElementById('view-frame');
            const sidebar   = document.getElementById('sidebar');
            const tooltip   = document.getElementById('mars-tooltip');
            const messageEl = document.getElementById('mars-message');
            const backBtn   = document.getElementById('shell-back-btn');
            const mobileThumb = document.getElementById('mobile-nav-thumb');
            const skeleton  = document.getElementById('skeleton-overlay');

            let currentRoute = null;
            let isFirstLoad = true;
            let navCount = 0;

            /* =========================================
               NOVO: SKELETON — só aparece se demorar
               ========================================= */
            const SKELETON_DELAY = 500;   // ms antes de mostrar o skeleton
            const SKELETON_SAFETY = 8000; // ms — evita ficar travado pra sempre

            let skeletonShowTimer = null;
            let skeletonSafetyTimer = null;

            function scheduleSkeleton() {
                if (!skeleton) return;
                clearTimeout(skeletonShowTimer);
                clearTimeout(skeletonSafetyTimer);
                skeletonShowTimer = setTimeout(() => {
                    skeleton.classList.remove('is-hidden');
                    // Se depois de SKELETON_SAFETY ainda não veio load, esconde
                    skeletonSafetyTimer = setTimeout(() => {
                        console.warn('[shell] Skeleton safety timeout — forçando hide.');
                        skeleton.classList.add('is-hidden');
                    }, SKELETON_SAFETY);
                }, SKELETON_DELAY);
            }

            function cancelSkeleton() {
                if (!skeleton) return;
                clearTimeout(skeletonShowTimer);
                clearTimeout(skeletonSafetyTimer);
                // Se já apareceu, faz fade-out suave
                if (!skeleton.classList.contains('is-hidden')) {
                    skeleton.classList.add('is-hidden');
                }
            }
            /* FIM NOVO: SKELETON */

            const marsMessages = {
                start:   '<strong>Welcome, Student!</strong> Você está usando o Language Lab, cortesia da teacher <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer" class="footer-link">@dicarvalho.prof</a> | <a href="https://wa.me/5516993272278/" target="_blank" rel="noopener noreferrer" class="footer-link">Torne-se aluno</a> e tenha um tutor só para você por um valor justo.',
                tools:   'Aqui estão todas as nossas ferramentas!',
                profile: 'Aqui é só para quem é aluno.',
                biblioteca: 'Nossa biblioteca de conteúdos!',
                teacher: 'Um pouco sobre a teacher!',
                todas:   'Essa é a lista completa de ferramentas!'
            };

            const mobileNavRoutes = ['start', 'tools', 'profile', 'biblioteca', 'teacher'];

            function syncMobileNavThumb(route) {
                if (!mobileThumb) return;
                const idx = mobileNavRoutes.indexOf(route);
                if (idx >= 0) mobileThumb.style.setProperty('--idx', idx);
            }

            function routeFromHash() {
                const hash = window.location.hash.replace(/^#\/?/, '');
                return hash || 'start';
            }

            function updateBackBtn() {
                const hasBrowserHistory = window.history.length > 1;
                backBtn.disabled = !(navCount > 0 || hasBrowserHistory);
            }

            iframe.addEventListener('load', () => {
                /* NOVO: SKELETON — cancela (ou esconde, se já apareceu) */
                cancelSkeleton();
                requestAnimationFrame(() => {
                    iframe.style.opacity = '1';
                });
                isFirstLoad = false;
            });

            function navigateTo(route, updateUrl = true) {
                if (!route || route === currentRoute) return;
                currentRoute = route;

                if (updateUrl) {
                    history.pushState({ route }, '', '#/' + route);
                    navCount++;
                    updateBackBtn();
                }

                document.querySelectorAll('.nav-item, .mobile-nav__item').forEach(link => {
                    link.classList.toggle('active', link.dataset.route === route);
                });

                syncMobileNavThumb(route);

                if (marsMessages[route]) messageEl.innerHTML = marsMessages[route];

                iframe.style.opacity = '0';
                /* NOVO: SKELETON — agenda (só mostra se demorar > SKELETON_DELAY) */
                scheduleSkeleton();

                let swapped = false;
                const swapSrc = () => {
                    if (swapped) return;
                    swapped = true;
                    iframe.removeEventListener('transitionend', onEnd);
                    iframe.src = 'views/' + route + '/index.html';
                    /* NÃO cancela o skeleton aqui — o listener de 'load' cuida disso */
                };
                const onEnd = (e) => {
                    if (e.propertyName === 'opacity') swapSrc();
                };

                iframe.addEventListener('transitionend', onEnd);
                setTimeout(swapSrc, 250);
            }

            window.addEventListener('popstate', () => {
                if (navCount > 0) navCount--;
                updateBackBtn();
                navigateTo(routeFromHash(), false);
            });

            window.addEventListener('message', (event) => {
                if (event.data && event.data.action === 'navigate') {
                    if (event.data.route === 'back') {
                        if (!backBtn.disabled) backBtn.click();
                        return;
                    }
                    if (event.data.route !== currentRoute) {
                        navigateTo(event.data.route);
                    }
                }
            });

            backBtn.addEventListener('click', () => {
                if (navCount > 0) {
                    history.back();
                } else if (window.history.length > 1) {
                    window.history.back();
                }
            });

            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('sidebar-close').addEventListener('click', () => {
                    sidebar.classList.toggle('sidebar--collapsed');
                });

                document.querySelectorAll('[data-route]').forEach(el => {
                    el.addEventListener('click', e => {
                        e.preventDefault();
                        navigateTo(el.dataset.route);
                    });
                });

                document.getElementById('mars-btn').addEventListener('click', () => {
                    tooltip.classList.toggle('show');
                });
                document.getElementById('mars-close').addEventListener('click', () => {
                    tooltip.classList.remove('show');
                });

                setTimeout(() => {
                    navigateTo(routeFromHash(), false);
                    syncMobileNavThumb(currentRoute);
                    updateBackBtn();
                }, 150);
            });
        })();
    </script>

</body>
</html>
