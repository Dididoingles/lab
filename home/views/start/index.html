<html lang="pt-BR">
<head>

    <title>Início — Language Lab</title>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --ink: #222222; --paper: #ffffff;
            --inkgrey: #222222af;
            --accent: #c20000; --accent-dark: #a30000; --muted: #666666;
            --shadow-hard-sm: 2px 3px 0 rgba(34,34,34,.85);
            --font-title: 'Poppins', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-hand: 'Gochi Hand', cursive;
            --font-caveat: 'Caveat', cursive;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            background: transparent;
            font-family: var(--font-title);
            color: var(--ink);
            min-height: 100%;
        }
        
        body {
            padding: 60px 40px 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }

        .view { display: flex; flex-direction: column; width: 100%; max-width: 800px; }

        /* =========================================
           #1 — BANNER DE BOAS-VINDAS (imagem)
           Integrado ao fundo: sem borda, sombra ou caixa.
           Full-bleed: ocupa a largura toda da tela.
           Altura automática: cresce proporcionalmente.
           ========================================= */
        .welcome-hero {
            position: relative;
            /* Full-bleed: vaza o padding do body (40px em cada lado) */
            margin-left: -20px;
            margin-right: -40px;
            width: calc(100% + 80px);
            margin-bottom: 32px;
            /* Sem altura fixa: o container acompanha a proporção da imagem */
        }

        .welcome-hero-img {
            display: block;
            width: 110%;
            height: auto;       /* cresce proporcionalmente à largura */
            object-fit: contain;
            object-position: center;
            opacity: 50%;
        }

        /* =========================================
           #2 — ACESSO RÁPIDO
           ========================================= */
        .quick-access {
            margin-bottom: 20px;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-kicker {
            font-family: var(--font-title);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .section-title {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 20px;
            color: var(--ink);
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 640px) {
            .quick-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
        }

        /* CARD DE ACESSO RÁPIDO */
        .quick-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid rgba(34,34,34,0.06);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px 12px;
            gap: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition:
                transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s ease,
                border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .quick-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 40%, var(--aura, #c20000) 0%, transparent 70%);
            opacity: 0.07;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .quick-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 16px 32px rgba(0,0,0,0.10),
                0 6px 14px var(--aura-shadow, rgba(120,0,0,0.15));
            border-color: rgba(34,34,34,0.02);
        }
        .quick-card:hover::before { opacity: 0.16; }
        .quick-card:active { transform: translateY(-1px) scale(0.99); }

        /* Imagem do card de acesso rápido — sem container, direto no card */
        .quick-card > img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .quick-card:hover > img {
            transform: scale(1.08) rotate(-3deg);
        }

        .quick-card-name {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 12px;
            color: var(--ink);
            letter-spacing: -0.03em;
            line-height: 1.2;
            text-align: center;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .quick-card-desc {
            font-family: var(--font-title);
            font-weight: 400;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: -0.02em;
            line-height: 1.3;
            text-align: center;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* =========================================
           #4 — EASTER EGG (livro)
           ========================================= */
        .book-egg {
            display: flex;
            align-items: center;
            justify-content: left;
            gap: 10px;
            margin: 4px 0 28px;
            flex-wrap: wrap;
        }

        .book-egg-text {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: normal;
            line-height: 1.3;
        }

        .book-egg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid rgba(34,34,34,0.12);
            background: var(--paper);
            color: var(--ink);
            text-decoration: none;
            font-size: 13px;
            transition: transform 0.2s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .book-egg-btn:hover {
            color: var(--accent);
            border-color: rgba(194,0,0,0.35);
            background: rgba(194,0,0,0.05);
            transform: translateX(3px);
        }
        .book-egg-btn:active { transform: translateX(1px) scale(0.95); }

        /* =========================================
           #5 — CARROSSEL (inalterado)
           ========================================= */
        .carousel-area {
            position: relative;
            width: 100%;
            margin-bottom: 5px;
        }

        .hand-hint {
            position: absolute;
            top: 40px;
            right: 30px;
            width: 300px;
            pointer-events: none;
            z-index: 4;
        }

        .hand-hint-img {
            display: block;
            width: 100%;
            height: auto;
        }

        .carousel-section {
            position: relative; 
            width: 100%; 
            height: 320px;
            display: flex; 
            align-items: flex-start; 
            justify-content: flex-start; 
            overflow: hidden; 
            margin: 10px 0 10px 0;
            touch-action: pan-y; user-select: none;
        }
        .carousel-track {
            position: relative; 
            width: 100%; 
            height: 100%;
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            cursor: grab;
        }
        .carousel-track:active { cursor: grabbing; }
        
        .card-scale {
            position: absolute; 
            top: 50%; 
            left: 50px; 
            transform: translate(0, -50%) scale(.7);
            opacity: 0; filter: blur(4px); z-index: 0; pointer-events: none;
            transition: transform .7s cubic-bezier(.22,1,.36,1),
                        opacity .7s cubic-bezier(.22,1,.36,1),
                        filter .7s cubic-bezier(.22,1,.36,1);
            will-change: transform, opacity, filter;
        }
        
        .card {
            width: 220px; height: 270px;
            border-radius: 20px; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 40px 14px 12px; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15); flex-shrink: 0;
        }
        
        .card-art {
            width: 65%; max-width: 130px;
            height: var(--art-height, 100px); object-fit: contain; display: block; flex-shrink: 0;
            filter: drop-shadow(0 10px 20px var(--card-shadow, rgba(0,0,0,.3))) brightness(1.05);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
        }
        
        .card-text { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; flex-shrink: 0; }
        
        .card-title {
            font-family: var(--font-title); font-weight: 700; font-size: var(--title-size, 16px);
            color: #fff; letter-spacing: -.03em; line-height: 1.1; text-align: center; width: 100%;
            display: -webkit-box; -webkit-line-clamp: var(--title-lines, 2);
            -webkit-box-orient: vertical; overflow: hidden;
            min-height: calc(1.1em * var(--title-lines, 2));
        }
        
        .card-desc {
            font-family: var(--font-title); font-weight: 400; font-size: var(--desc-size, 11px);
            color: rgba(255,255,255,.85); letter-spacing: -.02em; line-height: 1.3;
            text-align: center; width: 100%;
            display: -webkit-box; -webkit-line-clamp: var(--desc-lines, 2);
            -webkit-box-orient: vertical; overflow: hidden;
            min-height: calc(1.3em * var(--desc-lines, 2));
        }
        
        .card-scale.active {
            transform: translate(0, -50%) scale(1);
            opacity: 1; filter: blur(0); z-index: 3; pointer-events: auto; cursor: pointer;
        }
        
        .card-scale.thumbnail-left {
            transform: translate(-60px, -50%) scale(.4);
            opacity: 0; filter: blur(2px); z-index: 1; pointer-events: none;
        }
        
        .card-scale.thumbnail-right {
            transform: translate(200px, -50%) scale(.45);
            opacity: .35; filter: blur(2px); z-index: 1;
        }
        
        .card-scale.hidden-card {
            transform: translate(200px, -50%) scale(.3);
            opacity: 0; filter: blur(4px); z-index: 0;
        }
        
        .carousel-dots {
            position: absolute; bottom: -10px; left: 50px; 
            display: flex; gap: 8px; z-index: 5;
        }
        
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background-color: var(--accent); opacity: .25; cursor: pointer;
            transition: opacity .4s, transform .4s cubic-bezier(.22,1,.36,1),
                        width .4s cubic-bezier(.22,1,.36,1);
        }
        .dot.active { opacity: 1; width: 20px; border-radius: 4px; }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; padding: 0;
            margin-left: 10px;
            background: var(--paper); border: 1px solid rgba(34,34,34,.1);
            border-radius: 50%; color: var(--accent); font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
            box-shadow: 0 4px 12px rgba(0,0,0,.06);
            transition: transform .2s, background-color .2s, color .2s;
        }
        .nav-btn:hover { background: var(--accent); color: #fff; transform: translateY(-50%) scale(1.08); }
        .nav-btn:active { transform: translateY(-50%) scale(.95); }
        
        .prev-btn { left: -5px; } 
        .next-btn { left: 272px; }

        /* =========================================
           BOTÃO VER TUDO
           ========================================= */
        .see-all-wrapper {
            display: flex;
            justify-content: flex-start;
            margin: 4px 0 0 0;
            padding-left: 504px;
        }

        .btn-see-all {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font-hand);
            letter-spacing: normal;
            font-size: 14px;
            padding: 0 10px;
            height: 38px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid var(--ink);
            text-decoration: none;
            background: #d15252;
            color: #fff;
            box-shadow: var(--shadow-hard-sm);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
        }
        .btn-see-all:hover {
            background: var(--accent-dark);
            transform: translate(1px, 1px);
            box-shadow: 1px 2px 0 rgba(34,34,34,0.85);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f12d; }
        ::-webkit-scrollbar-thumb { background: #8888882a; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media(max-width: 1024px) {
           
            body {
                padding: 80px 20px calc(48px + env(safe-area-inset-bottom, 0px) + 32px) 20px;
            }

            .welcome-hero {
                /* Full-bleed no mobile: vaza o padding lateral de 20px */
                margin-left: -10px;
                margin-right: -20px;
                width: calc(100% + 40px);
                margin-bottom: 24px;
                /* Sem altura fixa no mobile também */
            }

            .section-title { font-size: 18px; }

            .quick-grid { gap: 10px; }
            .quick-card { padding: 12px 8px 10px; gap: 8px; border-radius: 14px; }
            .quick-card > img { width: 44px; height: 44px; }
            .quick-card-name { font-size: 11px; }
            .quick-card-desc { font-size: 9px; }

            .book-egg { margin: 15px 0 22px; }
            .book-egg-text { font-size: 10px; }

            .hand-hint {
                position: relative;
                top: auto;
                right: auto;
                width: 220px;
                margin: 10px 0 10px 150px;
            }

            .carousel-section { height: 280px; margin: 10px 0; }
            .card { width: 190px; height: 240px; padding: 12px 10px; }
            .card-art { height: 70px; }
            .card-title { font-size: var(--title-size, 14px); }
            .card-desc { font-size: var(--desc-size, 10px); }
            
            .carousel-section { justify-content: center; }
            .carousel-track { justify-content: center; }
            
            .card-scale { left: 50%; transform: translate(-50%, -50%) scale(.7); }
            .card-scale.active { transform: translate(-50%, -50%) scale(1); }
            .card-scale.thumbnail-left  { transform: translate(calc(-50% - 20px), -50%) scale(.4); opacity: .3; pointer-events: auto; }
            .card-scale.thumbnail-right { transform: translate(calc(30% + 20px), -50%) scale(.4); opacity: .3; }
            .card-scale.hidden-card { transform: translate(calc(50% + 60px), -50%) scale(.3); }
            
            .carousel-dots { bottom: 0; left: 50%; transform: translateX(-50%); }
            .nav-btn { width: 30px; height: 30px; font-size: 12px; }
            .prev-btn { left: 0px; }
            .next-btn { right: 0px; left: auto; }
            .btn-see-all {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-family: var(--font-hand);
                letter-spacing: normal;
                font-size: 14px;
                padding: 0 16px;
                height: 38px;
            }

            .see-all-wrapper {
                display: flex;
                justify-content: center;
                margin: 4px 0 0 0;
                padding-left: 0px;
            }
        }
    </style>
</head>
<body>

    <section class="view" id="page-home">

        <!-- #1 — Banner de boas-vindas (imagem integrada ao fundo, full-bleed) -->
        <div class="welcome-hero">

          <!-- #4 — Easter egg -->
          <div class="book-egg">
            <span class="book-egg-text">O que tinha no livro</span>
            <a class="book-egg-btn" href="../../../book.html" aria-label="Abrir o livro">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

    </section>

    <script>
    (function () {
        const cardsData = [
            { art: '../../../assets/card3.png',  title: 'Leitor Interativo', description: 'Aprenda a pronúncia de qualquer texto', link: 'https://dididoingles.github.io/leitor/', color: '#c20000', shadow: 'rgba(120,0,0,.55)', layout: { artHeight: 100, titleSize: '15px', descSize: '11px', titleLines: 2, descLines: 2 } },
            { art: '../../../assets/stop.webp',   title: 'Stop game',        description: 'Um joguinho dinâmico de stop para estimular o vocabulário em Inglês', link: 'https://dididoingles.github.io/stopgame/', color: '#3d3d3d', shadow: '', layout: { artHeight: 110, titleSize: '16px', descSize: '11px', titleLines: 2, descLines: 2 } },
            { art: '../../../assets/wheel.png',  title: 'Conversation wheel',description: 'Ideal para estimular as aulas de conversação', link: 'https://dididoingles.github.io/conversationwheel/', color: '#3a5466', shadow: '', layout: { artHeight: 110, titleSize: '16px', descSize: '11px', titleLines: 2, descLines: 2 } },
            { art: '../../../assets/sketchbook.png',  title: 'My Sketchbook',    description: 'Pratique a gramática com tempos verbais', link: 'https://dididoingles.github.io/mysketchbook/', color: '#be634a', shadow: '', layout: { artHeight: 70, titleSize: '16px', descSize: '11px', titleLines: 1, descLines: 2 } },
            { art: '../../../assets/mars.png',   title: 'Role play',        description: 'Simule uma conversa em Inglês em diferentes situações.', link: 'https://dididoingles.github.io/marsroleplay/', color: '#c20000', shadow: '', layout: { artHeight: 110, titleSize: '16px', descSize: '11px', titleLines: 1, descLines: 2 } },
            { art: '../../../assets/listen.png', title: 'YouListen',        description: 'Pratique sua compreensão com vídeos curtinhos do YouTube.', link: 'https://dididoingles.github.io/youlisten/', color: '#a10000', shadow: '', layout: { artHeight: 110, titleSize: '16px', descSize: '11px', titleLines: 1, descLines: 3 } },
            { art: '../../../assets/card5.png',  title: 'Você me conhece?', description: 'Versão em Inglês do famoso "Perguntados" para casais.', link: 'https://dididoingles.github.io/couples_trivia/', color: '#695c78', shadow: '', layout: { artHeight: 110, titleSize: '16px', descSize: '11px', titleLines: 2, descLines: 2 } },
            { art: '../../../assets/paint.webp',     title: 'Airpaint Beta',    description: 'Desenhe usando gestos das mãos via webcam.', link: 'https://dididoingles.github.io/airpaint/', color: '#a55c5c', shadow: '', layout: { artHeight: 110, titleSize: '16px', descSize: '11px', titleLines: 1, descLines: 2 } }
        ];
        let currentIndex = 0;

        function applyLayout(el, layout) {
            if (!layout) return;
            if (layout.artHeight)  el.style.setProperty('--art-height',  layout.artHeight + 'px');
            if (layout.titleSize)  el.style.setProperty('--title-size',  layout.titleSize);
            if (layout.descSize)   el.style.setProperty('--desc-size',   layout.descSize);
            if (layout.titleLines) el.style.setProperty('--title-lines', layout.titleLines);
            if (layout.descLines)  el.style.setProperty('--desc-lines',  layout.descLines);
        }

        function buildCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('carouselDots');
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            cardsData.forEach((data, i) => {
                const scale = document.createElement('div');
                scale.className = 'card-scale hidden-card';

                const card = document.createElement('div');
                card.className = 'card';
                card.style.backgroundColor = data.color;
                if (data.shadow) card.style.setProperty('--card-shadow', data.shadow);
                applyLayout(card, data.layout);

                const art = document.createElement('img');
                art.src = data.art; art.alt = data.title; art.className = 'card-art';

                const textBlock = document.createElement('div');
                textBlock.className = 'card-text';

                const title = document.createElement('h3');
                title.className = 'card-title'; title.textContent = data.title;

                const desc = document.createElement('p');
                desc.className = 'card-desc'; desc.textContent = data.description;

                textBlock.appendChild(title);
                textBlock.appendChild(desc);
                card.appendChild(art);
                card.appendChild(textBlock);
                scale.appendChild(card);
                track.appendChild(scale);

                scale.addEventListener('click', () => {
                    if (i === currentIndex) window.open(data.link, '_blank');
                });

                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => { stopAutoRotate(); goToCard(i); });
                dotsContainer.appendChild(dot);
            });

            initCarouselGestures();
            updateCarousel();
            startAutoRotate();
        }

        function updateCarousel() {
            const allScales = document.querySelectorAll('.card-scale');
            const total = cardsData.length;
            const prevIndex = (currentIndex - 1 + total) % total;
            const nextIndex = (currentIndex + 1) % total;

            allScales.forEach((scale, i) => {
                scale.classList.remove('active', 'thumbnail-left', 'thumbnail-right', 'hidden-card');
                if (i === currentIndex) scale.classList.add('active');
                else if (i === prevIndex) scale.classList.add('thumbnail-left');
                else if (i === nextIndex) scale.classList.add('thumbnail-right');
                else scale.classList.add('hidden-card');
            });

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function goToCard(index) { currentIndex = index; updateCarousel(); }
        function nextCard() { currentIndex = (currentIndex + 1) % cardsData.length; updateCarousel(); }
        function prevCard() { currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length; updateCarousel(); }

        let autoRotateTimer = null;
        const AUTO_ROTATE_DELAY = 4000;

        function startAutoRotate() {
            stopAutoRotate();
            autoRotateTimer = setInterval(() => {
                nextCard();
            }, AUTO_ROTATE_DELAY);
        }

        function stopAutoRotate() {
            if (autoRotateTimer) {
                clearInterval(autoRotateTimer);
                autoRotateTimer = null;
            }
        }

        function initCarouselGestures() {
            const track = document.getElementById('carouselTrack');
            let startX = 0;
            let isDragging = false;
            const threshold = 30;

            const interactionEvents = ['touchstart', 'mousedown'];
            interactionEvents.forEach(evt => {
                track.addEventListener(evt, () => stopAutoRotate(), { passive: true });
            });

            track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isDragging = true; }, { passive: true });
            track.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const diff = e.touches[0].clientX - startX;
                if (Math.abs(diff) > threshold) {
                    if (diff > 0) prevCard(); else nextCard();
                    isDragging = false;
                }
            }, { passive: true });
            track.addEventListener('touchend', () => { isDragging = false; });

            track.addEventListener('mousedown', (e) => { startX = e.clientX; isDragging = true; track.style.cursor = 'grabbing'; });
            track.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const diff = e.clientX - startX;
                if (Math.abs(diff) > threshold) {
                    if (diff > 0) prevCard(); else nextCard();
                    isDragging = false;
                    track.style.cursor = 'grab';
                }
            });
            track.addEventListener('mouseup', () => { isDragging = false; track.style.cursor = 'grab'; });
            track.addEventListener('mouseleave', () => { isDragging = false; track.style.cursor = 'grab'; });
        }

        document.querySelector('.prev-btn').addEventListener('click', () => { stopAutoRotate(); prevCard(); });
        document.querySelector('.next-btn').addEventListener('click', () => { stopAutoRotate(); nextCard(); });

        buildCarousel();
    })();
    </script>

</body>
</html>
