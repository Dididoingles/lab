<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Metatags de Compartilhamento (Open Graph / WhatsApp / Twitter) -->
     <meta property="og:title" content="Language Lab">
     <meta property="og:description" content="Um laboratório, dezenas de maneiras de aprender.">
     <meta property="og:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
     <meta property="og:url" content="https://dididoingles.github.io/lab/">
     <meta property="og:type" content="website">
     
     <meta name="twitter:card" content="summary_large_image">
     <meta name="twitter:title" content="Language Lab">
     <meta name="twitter:description" content="Um laboratório, dezenas de maneiras de aprender.">
     <meta name="twitter:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
 
     <!-- Favicon -->
     <link rel="icon" type="image/png" href="https://dididoingles.github.io/lab/assets/favilab.png">
     <link rel="apple-touch-icon" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <title>Language Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@100;200;300;400;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --red: #c20000;
            --border: rgba(240,236,228,.08);
            --text: #f0ece4;
            --muted: #8a8a8a;
        }

        html, body {
            background: transparent;
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            min-height: 100%;
            letter-spacing: -0.02em;
        }
        body {
            width: 100%;
            padding: 80px 1.5rem 4rem;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }
        a { color: inherit; text-decoration: none; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f12d; }
        ::-webkit-scrollbar-thumb { background: #8888882a; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* ============================================================
           VIEWS (grid / detail)
           ============================================================ */
        .view { display: none; }
        .view.active { display: block; }

        /* ============================================================
           HEADER (grid)
           ============================================================ */
        .header { text-align: center; margin-bottom: 2rem; }

        .eyebrow {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: 'Poppins', sans-serif; font-weight: 600;
            font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--red);
        }
        .eyebrow::before, .eyebrow::after {
            content: ''; width: 20px; height: 1px; background: currentColor;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-top: 0.5rem;
            color: var(--text);
        }
        h1 .accent { color: var(--red); }

        .page-subtitle {
            font-family:'Courier New', Courier, monospace;
            letter-spacing: normal;
            font-size: 16px;
            color: #aaa;
            max-width: 520px;
            margin: 8px auto 0;
            line-height: 1.4;
        }

        /* ============================================================
           BUSCA
           ============================================================ */
        .search-wrap {
            max-width: 560px;
            margin: 22px auto 0;
            position: relative;
        }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-box i {
            position: absolute; left: 16px;
            font-size: 13px; color: #999;
            pointer-events: none;
            transition: color 0.2s ease;
        }
        .search-box input {
            width: 100%; height: 46px;
            padding: 0 42px;
            border-radius: 14px;
            border: 1.5px solid rgba(194,0,0,.45);
            background: rgba(255,255,255,.03);
            color: var(--muted);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            letter-spacing: -0.02em;
            outline: none;
            box-shadow:
                0 0 0 1px rgba(194,0,0,.10),
                0 6px 22px -6px rgba(194,0,0,.35);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .search-box input::placeholder {
            color: #777; font-weight: 400;
            transition: color 0.2s ease;
        }
        .search-box input:hover {
            border-color: rgba(194,0,0,.65);
            box-shadow:
                0 0 0 1px rgba(194,0,0,.14),
                0 8px 26px -6px rgba(194,0,0,.45);
        }
        .search-box input:hover::placeholder { color: var(--red); }
        .search-box input:focus {
            border-color: var(--red);
            box-shadow:
                0 0 0 3px rgba(194,0,0,.14),
                0 8px 28px -6px rgba(194,0,0,.50);
        }
        .search-box input:focus::placeholder { color: var(--red); }
        .search-box:focus-within i { color: var(--red); }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            top: 120px; right: 20px;
            z-index: 500;
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 18px;
            background: #0d0d0d;
            border: 1px solid rgba(240,236,228,.08);
            border-left: 2px solid var(--red);
            border-radius: 12px;
            box-shadow:
                0 10px 30px rgba(0,0,0,.45),
                0 0 0 1px rgba(194,0,0,.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0;
            color: var(--text);
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: opacity .35s ease, transform .35s ease;
        }
        .toast.visible { opacity: 1; transform: translateY(0); }
        .toast-spinner {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid rgba(194,0,0,.20);
            border-top-color: var(--red);
            animation: spinnerRotate 0.9s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spinnerRotate { to { transform: rotate(360deg); } }
        .toast.toast-error {
            border-color: rgba(194,0,0,.35);
            border-left: 2px solid var(--red);
            background: #140b0b;
            color: #f0c0c0;
        }
        .toast.toast-error .toast-spinner { display: none; }

        /* ============================================================
           GRID DE LIVROS
           ============================================================ */
        #library { max-width: 1300px; margin: 2.5rem auto 0; }

        #status {
            text-align: center; color: var(--muted);
            font-size: .8rem; padding: 2rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .book-group {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 54px 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .book-item {
            position: relative;
            width: 270px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: visible;
            cursor: pointer;
            background: transparent;
            border: none;
            box-shadow: none;
            transition: transform .45s cubic-bezier(.2,0,0,1);
        }
        .book-item:nth-child(2),
        .book-item:nth-child(3),
        .book-item:nth-child(4) { margin-left: -58.5px; }
        .book-item:nth-child(2) { z-index: 2; }
        .book-item:nth-child(3) { z-index: 3; }
        .book-item:nth-child(4) { z-index: 4; }
        .book-item:hover { transform: translateX(-25%) translateY(-7.2px); }

        .book-cover {
            width: 100%;
            display: block;
            border-radius: 6px;
            opacity: 0;
            transition: opacity .6s;
        }
        .book-cover.loaded { opacity: 1; }

        .book-tag {
            position: absolute;
            top: 9px; left: 9px;
            background: var(--red);
            color: #fff;
            padding: 4px 11px;
            border-radius: 18px;
            font-size: .54rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity .3s;
            z-index: 5;
            pointer-events: none;
        }
        .book-item:hover .book-tag { opacity: 1; }

        /* ============================================================
           SKELETON
           ============================================================ */
        .skeleton-item {
            width: 270px;
            flex-shrink: 0;
            aspect-ratio: 2 / 3;
            border-radius: 6px;
            background: rgba(240,236,228,.05);
            overflow: hidden;
            position: relative;
        }
        .skeleton-item:nth-child(2),
        .skeleton-item:nth-child(3),
        .skeleton-item:nth-child(4) { margin-left: -58.5px; }
        .skeleton-item::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(240,236,228,.08) 40%,
                rgba(240,236,228,.12) 50%,
                rgba(240,236,228,.08) 60%,
                transparent 100%
            );
            transform: translateX(-100%);
            animation: shimmer 1.4s ease-in-out infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* ============================================================
           DETAIL VIEW
           ============================================================ */
        .detail-view {
            max-width: 820px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 32px;
            padding: 8px 14px;
            border: 1px solid rgba(240,236,228,.15);
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            transition: border-color .2s, color .2s, background .2s;
        }
        .back-link:hover {
            color: var(--red);
            border-color: rgba(194,0,0,.45);
            background: rgba(194,0,0,.05);
        }
        .back-link i { font-size: 11px; }

        .detail-kicker {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: 'Poppins', sans-serif; font-weight: 600;
            font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--red);
            margin-bottom: 14px;
        }
        .detail-kicker::before, .detail-kicker::after {
            content: ''; width: 20px; height: 1px; background: currentColor;
        }
        .detail-title {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1.1;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .detail-card {
            position: relative;
            background: #f5f2ec;
            border-radius: 18px;
            padding: 2.5rem;
            display: flex;
            gap: 2.5rem;
            color: #222;
            margin-top: 24px;
            box-shadow:
                0 24px 60px -12px rgba(0,0,0,.55),
                0 0 0 1px rgba(194,0,0,.06);
        }

        .detail-cover-wrap {
            position: relative;
            width: 260px;
            flex-shrink: 0;
            align-self: flex-start;
        }
        .detail-cover-wrap::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 150%; height: 150%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle closest-side,
                rgba(194,0,0,.38) 0%,
                rgba(194,0,0,.16) 45%,
                transparent 78%
            );
            filter: blur(24px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .detail-cover {
            position: relative;
            z-index: 1;
            width: 100%;
            display: block;
            background: transparent;
        }

        .detail-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .detail-cat {
            display: inline-block;
            align-self: flex-start;
            background: rgba(194,0,0,.08);
            border: 1px solid rgba(194,0,0,.25);
            color: var(--red);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: .7rem;
            margin-bottom: 1rem;
        }
        .detail-desc {
            font-size: .92rem;
            line-height: 1.75;
            color: #444;
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }
        .detail-license {
            font-family: 'JetBrains Mono', monospace;
            font-size: .68rem;
            color: #888;
            margin-bottom: 1.25rem;
        }
        .detail-download {
            align-self: flex-start;
            display: inline-flex; align-items: center; gap: .5rem;
            background: var(--red); color: #fff;
            padding: .8rem 2rem;
            border-radius: 10px;
            font-size: .82rem; font-weight: 500;
            transition: background .2s, transform .15s;
        }
        .detail-download:hover {
            background: #a30000;
            transform: translate(1px, 1px);
        }

        /* ============================================================
           MOBILE
           ============================================================ */
        @media (max-width: 768px) {
            body { padding: 80px 1.5rem 4rem; }
            .toast { top: 120px; right: 12px; left: 12px; justify-content: center; }

            .book-group {
                display: grid; grid-template-columns: 1fr 1fr;
                gap: 16px; margin: 30px 0;
                background: transparent;
            }
            .book-item,
            .skeleton-item {
                width: 100%; margin-left: 0 !important;
                aspect-ratio: 2/3;
                background: transparent;
                box-shadow: none;
            }
            .skeleton-item { background: rgba(240,236,228,.05); }
            .book-item:hover { transform: scale(1.04); }

            .detail-card {
                flex-direction: column;
                padding: 1.5rem;
                gap: 1.5rem;
                align-items: center;
                text-align: center;
            }
            .detail-cover-wrap {
        width: 150px;
        margin: 0 auto;          /* ← garante centralização horizontal */
        align-self: center;      /* ← anula o flex-start do desktop */
    }
            .detail-cat { align-self: center; }
            .detail-desc { font-size: .85rem; }
            .detail-download {
                align-self: stretch;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <span class="toast-spinner"></span>
        <span id="toastText">Carregando livros…</span>
    </div>

    <!-- ============================================================
         VIEW: GRID
         ============================================================ -->
    <section class="view active" id="view-grid">
        <header class="header">
            <div class="eyebrow">Language Library</div>
            <h1><span class="accent">Biblioteca</span></h1>
            <p class="page-subtitle">Um acervo de materiais para aprender no seu ritmo.</p>
            <div class="search-wrap">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search" placeholder="Buscar por título, autor ou categoria...">
                </div>
            </div>
        </header>

        <main id="library">
            <div id="books-grid"></div>
        </main>
    </section>

    <!-- ============================================================
         VIEW: DETAIL
         ============================================================ -->
    <section class="view" id="view-detail">
        <div class="detail-view">
            <button class="back-link" id="back-btn">
                <i class="fas fa-arrow-left"></i> Voltar para a biblioteca
            </button>

            <span class="detail-kicker" id="d-kicker">Livro</span>
            <h1 class="detail-title" id="d-title"></h1>

            <div class="detail-card">
                <div class="detail-cover-wrap">
                    <img id="d-cover" class="detail-cover" alt="">
                </div>
                <div class="detail-body">
                    <span class="detail-cat" id="d-cat"></span>
                    <p class="detail-desc" id="d-desc"></p>
                    <p class="detail-license">Licença: material gratuito para uso pessoal e educacional.</p>
                    <a id="d-download" class="detail-download" target="_blank" rel="noopener noreferrer">
                        <i class="fas fa-download"></i> Fazer Download
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby3NxWcJZBdiej2WkZSEh2_gLTbaSN6xSM4zoqKFYRklxO5cuiq6JQ-QkNlNBws3sdb/exec";

        let allBooks = [];

        /* ============================================================
           TOAST
           ============================================================ */
        const toastEl = document.getElementById('toast');
        const toastText = document.getElementById('toastText');

        function showToast(message) {
            toastText.textContent = message;
            toastEl.classList.remove('toast-error');
            toastEl.classList.add('visible');
        }
        function showToastError(message) {
            toastText.textContent = message;
            toastEl.classList.add('toast-error');
            toastEl.classList.add('visible');
            setTimeout(hideToast, 3500);
        }
        function hideToast() {
            toastEl.classList.remove('visible');
        }

        /* ============================================================
           VIEWS
           ============================================================ */
        const viewGrid = document.getElementById('view-grid');
        const viewDetail = document.getElementById('view-detail');

        function showGrid() {
            viewDetail.classList.remove('active');
            viewGrid.classList.add('active');
            document.title = 'Language Library';
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function showDetail(book) {
            document.getElementById('d-kicker').textContent = book.Categoria || 'Livro';
            document.getElementById('d-title').textContent = book.Título || '';
            document.getElementById('d-cat').textContent = book.Categoria || '';
            document.getElementById('d-desc').textContent = book.Descrição || '';
            document.getElementById('d-cover').src = book.Capa || '';
            document.getElementById('d-cover').alt = book.Título || 'Capa';
            document.getElementById('d-download').href = book.LinkEbook || '#';

            viewGrid.classList.remove('active');
            viewDetail.classList.add('active');
            document.title = `${book.Título} — Language Library`;
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        /* ============================================================
           SKELETON
           ============================================================ */
        function renderSkeletons(count = 8) {
            const grid = document.getElementById('books-grid');
            grid.innerHTML = '';
            for (let i = 0; i < count; i += 4) {
                const group = document.createElement('div');
                group.className = 'book-group';
                for (let j = 0; j < 4 && (i + j) < count; j++) {
                    const sk = document.createElement('div');
                    sk.className = 'skeleton-item';
                    group.appendChild(sk);
                }
                grid.appendChild(group);
            }
        }

        /* ============================================================
           RENDER GRID
           ============================================================ */
        function renderBooks(books) {
            const grid = document.getElementById('books-grid');
            grid.innerHTML = '';

            if (books.length === 0) {
                grid.innerHTML = '<div id="status">Nenhum livro encontrado.</div>';
                return;
            }

            for (let i = 0; i < books.length; i += 4) {
                const group = document.createElement('div');
                group.className = 'book-group';

                books.slice(i, i + 4).forEach(book => {
                    const item = document.createElement('div');
                    item.className = 'book-item';

                    const tag = document.createElement('div');
                    tag.className = 'book-tag';
                    tag.textContent = 'Conheça o ebook';

                    const img = new Image();
                    img.className = 'book-cover';
                    img.src = book.Capa;
                    img.alt = book.Título || 'Capa';
                    img.onload = () => img.classList.add('loaded');

                    item.appendChild(tag);
                    item.appendChild(img);
                    item.addEventListener('click', () => openDetail(book));

                    group.appendChild(item);
                });

                grid.appendChild(group);
            }
        }

        /* ============================================================
           NAVEGAÇÃO (pushState / popstate)
           ============================================================ */
        function bookId(book) {
            return book.ID || book.Título || '';
        }

        function openDetail(book) {
            const id = bookId(book);
            history.pushState({ id }, '', '?id=' + encodeURIComponent(id));
            showDetail(book);
        }

        function backToGrid() {
            history.back();
        }

        document.getElementById('back-btn').addEventListener('click', backToGrid);

        window.addEventListener('popstate', () => {
            const id = new URLSearchParams(location.search).get('id');
            if (id && allBooks.length) {
                const book = allBooks.find(b => String(bookId(b)) === String(id));
                if (book) return showDetail(book);
            }
            showGrid();
        });

        /* ============================================================
           LOADER / API
           ============================================================ */
        async function loadLibrary() {
            const initialId = new URLSearchParams(location.search).get('id');

            showToast('Carregando livros…');
            renderSkeletons(8);

            try {
                const res = await fetch(API_URL);
                allBooks = await res.json();
                renderBooks(allBooks);
                hideToast();

                // Se a URL já veio com ?id=, renderiza direto o detail
                if (initialId) {
                    const book = allBooks.find(b => String(bookId(b)) === String(initialId));
                    if (book) {
                        history.replaceState({ id: initialId }, '', '?id=' + encodeURIComponent(initialId));
                        showDetail(book);
                    } else {
                        showGrid();
                    }
                } else {
                    showGrid();
                }
            } catch (e) {
                renderSkeletons(0);
                document.getElementById('books-grid').innerHTML =
                    '<div id="status">Erro ao carregar materiais.</div>';
                showToastError('Erro ao carregar materiais.');
            }
        }

        /* ============================================================
           BUSCA
           ============================================================ */
        document.getElementById('search').addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            if (!q) return renderBooks(allBooks);
            const filtered = allBooks.filter(b =>
                (b.Título || '').toLowerCase().includes(q) ||
                (b.Autor || '').toLowerCase().includes(q) ||
                (b.Categoria || '').toLowerCase().includes(q) ||
                (b.Descrição || '').toLowerCase().includes(q)
            );
            renderBooks(filtered);
        });

        /* ============================================================
           START
           ============================================================ */
        loadLibrary();

        setTimeout(() => {
            if (toastEl.classList.contains('visible') && !toastEl.classList.contains('toast-error')) {
                hideToast();
            }
        }, 8000);
    </script>
</body>
</html>
