<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Teste de nível</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* ====================================================
           VARIÁVEIS — IDENTIDADE LANGUAGE LAB (WARM PAPER)
           ==================================================== */
        :root {
            --ink: #222222;
            --paper: #fff6f2;            
            --paper-warm: #ffeeee;       
            --accent: #c20000;
            --accent-dark: #a30000;
            --muted: #6b5252;
            --muted-light: #8a6f6f;
            --border: rgba(34,34,34,0.10);
            --border-strong: rgba(34,34,34,0.18);
            --shadow-hard-sm: 2px 3px 0 rgba(34,34,34,.85);
            --shadow-hard: 4px 6px 0 rgba(34,34,34,.85);
            --font-title: 'Poppins', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-hand: 'Gochi Hand', cursive;
            --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ====================================================
           RESET
           ==================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: var(--font-title);
            color: var(--ink);
            background-color: transparent;
            background-image:
                radial-gradient(ellipse 60% 80% at 0% 50%,  rgba(194,0,0,0.06) 0%, rgba(194,0,0,0) 60%),
                radial-gradient(ellipse 60% 80% at 100% 50%, rgba(194,0,0,0.06) 0%, rgba(194,0,0,0) 60%),
                radial-gradient(ellipse 50% 60% at 50% 0%,   rgba(194,0,0,0.03) 0%, rgba(194,0,0,0) 70%);
            background-attachment: fixed;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 100px;
        }

        /* ====================================================
           SCROLLBAR
           ==================================================== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(34, 34, 34, 0); border-radius: 10px; }

        p, .text {
            text-wrap: pretty;
            overflow-wrap: break-word;
            hyphens: auto;
            -webkit-hyphens: auto;
        }

        /* ====================================================
           PALCO — DUAS PÁGINAS SOBREPOSTAS
           ==================================================== */
        .stage {
            position: relative;
            width: 100%;
            max-width: 1180px;
            height: min(94dvh, 820px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            gap: 56px;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 0.55s var(--ease-out-expo),
                        transform 0.55s var(--ease-out-expo),
                        visibility 0s linear 0.55s;
        }

        .page.is-active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
            transition: opacity 0.55s var(--ease-out-expo),
                        transform 0.55s var(--ease-out-expo),
                        visibility 0s linear 0s;
        }

        .page--test { align-items: stretch; }

        /* ====================================================
           COLUNA ESQUERDA
           ==================================================== */
        .col-left {
            display:flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
            gap: 22px;
        }

        .hero-sub {
            font-family: var(--font-mono);
            font-size: 0.86rem;
            color: var(--muted);
            letter-spacing: 0.02em;
            margin-top: -100px;
            line-height: 1.55;
            max-width: 38ch;
            text-wrap: pretty;
        }

        /* ====================================================
           VÍDEO
           ==================================================== */
        .video-stage {
            width: 100%;
            max-width: 660px;
            aspect-ratio: 16 / 10;
            position: relative;
            isolation: isolate;
            padding: 8px;
            margin: -8px;
        }

        .video-stage video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            pointer-events: none;
            background: transparent;
            -webkit-mask-image:
                radial-gradient(ellipse 95% 95% at 50% 50%, #000 55%, transparent 100%),
                linear-gradient(to right,  transparent 0%, #000 12%, #000 88%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image:
                radial-gradient(ellipse 95% 95% at 50% 50%, #000 55%, transparent 100%),
                linear-gradient(to right,  transparent 0%, #000 12%, #000 88%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
            mask-composite: intersect;
            mix-blend-mode: multiply;
        }

        /* ====================================================
           COLUNA DIREITA
           ==================================================== */
        .col-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            gap: 22px;
        }

        .desc-lead {
            font-family: var(--font-title);
            font-size: clamp(1rem, 1.3vw, 1.14rem);
            line-height: 1.7;
            color: var(--ink);
            font-weight: 400;
            max-width: 46ch;
            text-wrap: pretty;
        }
        .desc-lead strong {
            color: var(--accent);
            font-weight: 600;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }

        .meta-chip {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            border: 1.5px solid var(--border-strong);
            padding: 5px 11px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: rgba(255,255,255,0.5);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }
        .meta-chip i { color: var(--accent); font-size: 0.7rem; }

        .btn-instagram {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.5);
            border: 1.5px solid var(--border-strong);
            color: var(--muted);
            padding: 5px 12px;
            border-radius: 999px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all .25s;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-instagram:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(194, 0, 0, 0.06);
        }
        .btn-instagram i { color: var(--accent); font-size: .85rem; }

        /* Contêiner para alinhar os elementos ao lado se desejado ou manter fluxo flexível */
        .action-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .start-btn {
            background: var(--accent);
            color: #fff;
            border: 2px solid var(--ink);
            padding: 12px 30px;
            border-radius: 11px;
            cursor: pointer;
            font-family: var(--font-title);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all .2s var(--ease-out-expo);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: var(--shadow-hard-sm);
        }
        .start-btn:hover {
            background: var(--accent-dark);
            transform: translate(-2px, -2px);
            box-shadow: 4px 5px 0 rgba(34,34,34,.85);
        }
        .start-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 rgba(34,34,34,.85);
        }
        .start-btn i { font-size: 0.75rem; }

        /* ====================================================
           PÁGINA DO TESTE
           ==================================================== */
        .test-card {
            display: flex;
            margin-top: 30px;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            width: 100%;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding-bottom: 14px;
            margin-bottom: 18px;
            margin-top: 60px;
            border-bottom: 1.5px dashed var(--border);
            flex-shrink: 0;
        }

        .game-header .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }
        .game-header .brand .l {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
            letter-spacing: -0.03em;
            white-space: nowrap;
        }
        .game-header .brand .s {
            font-family: var(--font-mono);
            font-size: 0.66rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 240px;
        }
        .progress-track {
            flex: 1;
            height: 5px;
            background: rgba(34,34,34,.08);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 4px;
            transition: width 0.55s var(--ease-out-expo);
        }
        .progress-count {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            white-space: nowrap;
            min-width: 48px;
            text-align: right;
        }

        .question-area {
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-right: 4px;
            transition: opacity 0.2s ease;
        }

        .level-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.66rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(194,0,0,0.06);
            border: 1px solid rgba(194,0,0,0.18);
            padding: 3px 9px;
            border-radius: 999px;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .question-text {
            font-family: var(--font-title);
            font-size: 1.1rem;
            line-height: 1.55;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 18px;
            min-height: 48px;
            text-wrap: pretty;
        }
        .question-text .blank {
            display: inline-block;
            min-width: 42px;
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
            font-weight: 700;
            text-align: center;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: rgba(255,255,255,0.6);
            border: 1.5px solid var(--border-strong);
            color: var(--ink);
            padding: 11px 15px;
            border-radius: 11px;
            text-align: left;
            cursor: pointer;
            transition: all .2s var(--ease-out-expo);
            font-family: var(--font-title);
            font-size: 0.92rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .option-btn .opt-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--muted);
            margin-right: 11px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1.5px solid var(--border-strong);
            font-size: 0.7rem;
        }
        .option-btn .opt-text { flex: 1; text-wrap: pretty; }

        .option-btn.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: var(--shadow-hard-sm);
            transform: translate(-1px, -1px);
        }
        .option-btn.selected .opt-letter {
            color: #fff;
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.12);
        }
        .option-btn:disabled { cursor: default; opacity: 0.65; }
        .option-btn.selected:disabled { opacity: 1; }

        .game-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 14px;
            margin-top: 10px;
            border-top: 1.5px dashed var(--border);
            flex-shrink: 0;
        }

        .btn-nav {
            background: rgba(255,255,255,0.5);
            border: 1.5px solid var(--border-strong);
            color: var(--muted);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            padding: 8px 14px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: lowercase;
        }
        .btn-nav.primary {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        /* ====================================================
           RESULT UI
           ==================================================== */
        .result-view {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            height: 100%;
        }
        .result-view.is-active { display: flex; }

        .res-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 6px;
        }
        .level-badge {
            font-family: var(--font-title);
            font-size: clamp(4rem, 8vw, 6rem);
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 4px 0 14px;
        }
        .res-desc {
            font-size: 0.96rem;
            color: var(--muted);
            line-height: 1.7;
            max-width: 50ch;
            margin-bottom: 26px;
        }
        .restart-btn {
            background: var(--accent);
            color: #fff;
            border: 2px solid var(--ink);
            padding: 11px 26px;
            border-radius: 11px;
            cursor: pointer;
            font-family: var(--font-title);
            font-weight: 600;
            font-size: 0.86rem;
            text-transform: uppercase;
            box-shadow: var(--shadow-hard-sm);
        }

        /* ====================================================
           RESPONSIVIDADE E AJUSTES SOLICITADOS
           ==================================================== */
        @media (max-width: 900px) {
            body { padding: 12px; padding-top: 300px; padding-bottom: 300px; flex-start; overflow-y: auto; }

            .stage {
                height: auto;
                min-height: calc(100dvh - 96px);
                align-items: stretch;
            }
            .game-footer { margin-bottom: 150px; }

            .page {
                position: relative;
                inset: auto;
                grid-template-columns: 1fr;
                gap: 28px;
                align-items: stretch;
                min-height: calc(100dvh - 96px);
            }

            .page:not(.is-active) { display: none; }
            .page.is-active { display: grid; }

            .video-stage { max-width: 100%; align-content: center; margin-bottom: -300px; }

            /* Apenas no mobile, apenas na hero (.col-left), diminuímos o espaço de cima dos 3 pontinhos (".hero-sub") */
            #page-intro .col-left .hero-sub {
                margin-top: 2px !important;
            }

            .desc-lead {
                font-size: clamp(0.8rem, 1.3vw, 1.14rem);
                line-height: 1.2;
                margin-top: -50px;
            }
        }
    </style>
</head>
<body>

    <!-- ================= PALCO COM DUAS PÁGINAS ================= -->
    <div class="stage">

        <!-- ============ PÁGINA 1: INTRO ============ -->
        <div class="page page--intro is-active" id="page-intro">

            <!-- Coluna esquerda: subtítulo (3 pontinhos) + vídeo -->
            <div class="col-left">
                <div>
                    <p class="hero-sub">...</p>
                </div>

                <div class="video-stage">
                    <video id="mars-video" autoplay muted playsinline preload="auto"
                           disablepictureinpicture disableremoteplayback
                           controlslist="nodownload nofullscreen noremoteplayback noplaybackrate">
                      <source src="https://dididoingles.github.io/lab/assets/sherlockmars2.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Coluna direita: descrição + chips/insta + botão ao lado -->
            <div class="col-right">
                <p class="desc-lead">
                    <strong>Atenção:</strong> Como este teste é autoavaliativo, é importante que você seja honesto nas respostas e não tente chutar. Quando não souber a resposta clique em 'não sei'
                </p>

                <div class="meta-row">
                    <span class="meta-chip"><i class="fa-solid fa-clock"></i>~5</span>
                    <span class="meta-chip"><i class="fa-solid fa-list-check"></i> 25 questões </span>
                    <span class="meta-chip"><i class="fa-solid fa-bullseye"></i> C1</span>
                    <a href="https://instagram.com/dicarvalho.prof" target="_blank" rel="noopener noreferrer"
                       class="btn-instagram" aria-label="Instagram do professor">
                        <i class="fa-brands fa-instagram"></i> Siga-nos
                    </a>
                </div>

                <!-- Contêiner que posiciona o botão ao lado dos elementos ou integrado na linha -->
                <div class="action-row">
                    <button class="start-btn" onclick="startTest()">
                        <i class="fa-solid fa-play"></i> Começar Teste
                    </button>
                </div>
            </div>
        </div>

        <!-- ============ PÁGINA 2: TESTE + RESULTADO ============ -->
        <div class="page page--test" id="page-test">
            <div class="test-card" style="grid-column: 1 / -1;">

                <!-- TELA DO TESTE -->
                <div id="game-ui" style="display:none; flex-direction:column; height:100%; min-height:0;">
                    <div class="game-header">
                        <div class="brand">
                            <span class="l">Teste de nivelamento</span>
                            <span class="s">// Mars × Lab</span>
                        </div>
                        <div class="progress-wrap">
                            <div class="progress-track">
                                <div id="progress-fill" class="progress-fill"></div>
                            </div>
                            <span id="progress-count" class="progress-count">1 / 25</span>
                        </div>
                    </div>

                    <div id="question-area" class="question-area"></div>

                    <div class="game-footer">
                        <button id="prev-btn" class="btn-nav" onclick="prev()">
                            <i class="fa-solid fa-chevron-left"></i> anterior
                        </button>
                        <button id="next-btn" class="btn-nav primary" onclick="next()" disabled>
                            próximo <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- TELA DE RESULTADO -->
                <div id="result-ui" class="result-view">
                    <div class="res-label">Diagnóstico de nível</div>
                    <div id="level-badge" class="level-badge">--</div>
                    <p id="level-desc" class="res-desc"></p>
                    <button class="restart-btn" onclick="resetTest()">
                        <i class="fa-solid fa-rotate-right"></i> Refazer Teste
                    </button>
                </div>

            </div>
        </div>

    </div>

    <script>
        (function () {
            const video = document.getElementById('mars-video');
            video.muted = true;
            video.autoplay = true;
            video.loop = false;
            video.addEventListener('loadedmetadata', () => {
                const tryPlay = video.play();
                if (tryPlay && tryPlay.catch) tryPlay.catch(() => {});
            });
            video.addEventListener('ended', () => {
                video.pause();
                video.currentTime = Math.max(0, video.duration - 0.05);
            });
            video.addEventListener('contextmenu', e => e.preventDefault());
        })();

        const pageIntro = document.getElementById('page-intro');
        const pageTest  = document.getElementById('page-test');

        function showTestPage() {
            pageIntro.classList.remove('is-active');
            setTimeout(() => { pageTest.classList.add('is-active'); }, 300);
        }

        function showIntroPage() {
            pageTest.classList.remove('is-active');
            setTimeout(() => { pageIntro.classList.add('is-active'); }, 300);
        }

        const questions = [
            { q: "Hi, ___ name is Mark. What's yours?", options: ["my", "me", "I", "mine"], a: 0, lv: "A1" },
            { q: "Where ___ you from?", options: ["is", "am", "are", "be"], a: 2, lv: "A1" },
            { q: "She ___ to the gym every morning.", options: ["go", "goes", "going", "is go"], a: 1, lv: "A1" },
            { q: "I don't have ___ money in my pocket.", options: ["some", "no", "any", "a"], a: 2, lv: "A1" },
            { q: "Look at those ___ playing in the park.", options: ["childs", "children", "childrens", "child"], a: 1, lv: "A1" },
            { q: "Yesterday, we ___ a very expensive car.", options: ["buy", "bought", "buys", "have bought"], a: 1, lv: "A2" },
            { q: "I think English is ___ than French.", options: ["more easy", "easier", "easyer", "the easiest"], a: 1, lv: "A2" },
            { q: "Have you ___ been to London?", options: ["never", "yet", "ever", "already"], a: 2, lv: "A2" },
            { q: "We ___ dinner when the phone rang.", options: ["had", "are having", "were having", "have"], a: 2, lv: "A2" },
            { q: "If it ___ tomorrow, I'll stay home.", options: ["rains", "will rain", "rain", "rained"], a: 0, lv: "A2" },
            { q: "I've been living here ___ 2010.", options: ["for", "since", "during", "ago"], a: 1, lv: "B1" },
            { q: "The bridge ___ built in the 19th century.", options: ["was", "is", "were", "has been"], a: 0, lv: "B1" },
            { q: "I'm looking forward to ___ you again.", options: ["see", "seeing", "to see", "seen"], a: 1, lv: "B1" },
            { q: "You ___ smoke here. It's strictly forbidden.", options: ["don't have to", "mustn't", "needn't", "shouldn't"], a: 1, lv: "B1" },
            { q: "She asked me where ___.", options: ["did I live", "I lived", "do I live", "I live"], a: 1, lv: "B1" },
            { q: "By the time you arrive, I ___ my homework.", options: ["finish", "will have finished", "will finish", "have finished"], a: 1, lv: "B2" },
            { q: "I wish I ___ more for the exam last week.", options: ["study", "had studied", "studied", "would study"], a: 1, lv: "B2" },
            { q: "Hardly ___ entered the room when the lights went out.", options: ["I had", "had I", "I", "did I"], a: 1, lv: "B2" },
            { q: "It's no use ___ about things you can't change.", options: ["to cry", "crying", "cry", "to be crying"], a: 1, lv: "B2" },
            { q: "Provided ___ you work hard, you will pass.", options: ["that", "to", "for", "with"], a: 0, lv: "B2" },
            { q: "Were it not for your help, I ___ in deep trouble.", options: ["would be", "will be", "am", "had been"], a: 0, lv: "C1" },
            { q: "Little ___ how much his life was about to change.", options: ["he knew", "did he know", "knew he", "he did know"], a: 1, lv: "C1" },
            { q: "The company is on the ___ of bankruptcy.", options: ["edge", "verge", "border", "rim"], a: 1, lv: "C1" },
            { q: "It is vital that he ___ informed of the decision.", options: ["is", "be", "was", "being"], a: 1, lv: "C1" },
            { q: "___ had I reached the station than the train left.", options: ["No sooner", "Scarcely", "Hardly", "Barely"], a: 0, lv: "C1" }
        ];

        const IDK = -1;
        let current = 0;
        let answers = Array(questions.length).fill(null);
        const letters = ['A', 'B', 'C', 'D'];
        let isTransitioning = false;

        function highlightBlank(text) {
            return text.replace(/___/g, '<span class="blank">___</span>');
        }

        function startTest() {
            showTestPage();
            setTimeout(() => {
                document.getElementById('game-ui').style.display = 'flex';
                document.getElementById('result-ui').classList.remove('is-active');
                render();
            }, 320);
        }

        function resetTest() {
            current = 0;
            answers = Array(questions.length).fill(null);
            isTransitioning = false;
            document.getElementById('progress-fill').style.width = '0%';
            showIntroPage();
            setTimeout(() => {
                document.getElementById('game-ui').style.display = 'none';
                document.getElementById('result-ui').classList.remove('is-active');
            }, 320);
        }

        function render() {
            if (isTransitioning) return;
            const q = questions[current];
            const area = document.getElementById('question-area');
            const progress = ((current + 1) / questions.length) * 100;

            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-count').innerText = `${current + 1} / ${questions.length}`;
            document.getElementById('prev-btn').disabled = current === 0;

            const nextBtn = document.getElementById('next-btn');
            const isLast = current === questions.length - 1;
            nextBtn.innerHTML = isLast ? 'finalizar <i class="fa-solid fa-check"></i>' : 'próximo <i class="fa-solid fa-chevron-right"></i>';
            nextBtn.disabled = answers[current] === null;

            area.style.opacity = '0';
            area.style.transform = 'translateY(6px)';

            setTimeout(() => {
                const isAnswered = answers[current] !== null;
                const isIdk = answers[current] === IDK;

                area.innerHTML = `
                    <span class="level-tag"><i class="fa-solid fa-bullseye"></i> Nível foco · ${q.lv}</span>
                    <p class="question-text">${highlightBlank(q.q)}</p>
                    <div class="options-list">
                        ${q.options.map((opt, i) => `
                            <button class="option-btn ${answers[current] === i ? 'selected' : ''}"
                                    onclick="selectOption(${i})" ${isAnswered ? 'disabled' : ''}>
                                <span class="opt-letter">${letters[i]}</span>
                                <span class="opt-text">${opt}</span>
                            </button>
                        `).join('')}
                        <button class="option-btn option-idk ${isIdk ? 'selected' : ''}"
                                onclick="selectOption(${IDK})" ${isAnswered ? 'disabled' : ''}>
                            <span class="opt-letter">?</span>
                            <span class="opt-text">Não sei / Não tenho certeza</span>
                        </button>
                    </div>
                `;
                area.scrollTop = 0;
                area.style.opacity = '1';
                area.style.transform = 'translateY(0)';
            }, 180);
        }

        function selectOption(index) {
            if (answers[current] !== null) return;
            answers[current] = index;
            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.disabled = true;
                const isIdkBtn = btn.classList.contains('option-idk');
                if (index === IDK && isIdkBtn) btn.classList.add('selected');
                else if (index !== IDK && !isIdkBtn && i === index) btn.classList.add('selected');
            });
            document.getElementById('next-btn').disabled = false;

            if (current < questions.length - 1) {
                setTimeout(() => { current++; render(); }, 420);
            }
        }

        function next() {
            if (answers[current] === null || isTransitioning) return;
            if (current < questions.length - 1) {
                isTransitioning = true;
                current++;
                render();
                setTimeout(() => { isTransitioning = false; }, 300);
            } else {
                finish();
            }
        }

        function prev() {
            if (current > 0 && !isTransitioning) {
                isTransitioning = true;
                current--;
                render();
                setTimeout(() => { isTransitioning = false; }, 300);
            }
        }

        function finish() {
            const unanswered = answers.some(a => a === null);
            if (unanswered) {
                if (confirm('Você ainda tem perguntas não respondidas. Deseja finalizar mesmo assim?')) proceedToResult();
            } else {
                proceedToResult();
            }
        }

        function proceedToResult() {
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('result-ui').classList.add('is-active');

            const levelScores = { A1: 0, A2: 0, B1: 0, B2: 0, C1: 0 };
            const levelTotals = { A1: 0, A2: 0, B1: 0, B2: 0, C1: 0 };

            questions.forEach((q, i) => {
                levelTotals[q.lv]++;
                if (answers[i] === q.a) levelScores[q.lv]++;
            });

            const pct = {};
            for (const lv in levelTotals) {
                pct[lv] = levelTotals[lv] > 0 ? (levelScores[lv] / levelTotals[lv]) * 100 : 0;
            }

            let finalLevel = "A1";
            if (pct.C1 >= 50 && pct.B2 >= 60) finalLevel = "C1";
            else if (pct.B2 >= 50 && pct.B1 >= 60) finalLevel = "B2";
            else if (pct.B1 >= 50 && pct.A2 >= 60) finalLevel = "B1";
            else if (pct.A2 >= 50) finalLevel = "A2";

            const descriptions = {
                "A1": "Parabéns, você chegou até aqui! Acreditamos que você está iniciando a jornada. Compreende expressões básicas e frases simples para necessidades imediatas. Importante: este teste depende do aluno, por isso não serve para comprovar fluência, apenas como referência",
                "A2": "Parabéns, você chegou até aqui! Acreditamos que você está no básico consolidado. Lida com tarefas rotineiras e troca informações simples.  Importante: este teste depende do aluno, por isso não serve para comprovar fluência, apenas como referência",
                "B1": "Parabéns, você chegou até aqui! Acreditamos que você está no intermediário. Comunica-se na maioria das situações de viagem.  Importante: este teste depende do aluno, por isso não serve para comprovar fluência, apenas como referência",
                "B2": "Parabéns, você chegou até aqui! Acreditamos que você está no intermediário superior. Compreende ideias complexas.  Importante: este teste depende do aluno, por isso não serve para comprovar fluência, apenas como referência",
                "C1": "Parabéns, você chegou até aqui! Acreditamos que você está no avançado. Utiliza o idioma de forma flexível. Importante: este teste depende do aluno, por isso não serve para comprovar fluência, apenas como referência"
            };

            document.getElementById('level-badge').innerText = finalLevel;
            document.getElementById('level-desc').innerText = descriptions[finalLevel];
        }

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ action: 'pageLoaded', route: 'teste' }, '*');
        }
    </script>
</body>
</html>
