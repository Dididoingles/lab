<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Metatags de Compartilhamento (Open Graph / WhatsApp / Twitter) -->
    <meta property="og:title" content="Language Lab">
    <meta property="og:description" content="Um laboratório, dezenas de maneiras de aprender.">
    <meta property="og:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
    <meta property="og:url" content="https://dididoingles.github.io/lab/">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Language Lab">
    <meta name="twitter:description" content="Um laboratório, dezenas de maneiras de aprender.">
    <meta name="twitter:image" content="https://dididoingles.github.io/lab/assets/metalab.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <link rel="apple-touch-icon" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <title>Laboratórios — Language Lab</title>

    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #222222; --paper: #ffffff;
            --accent: #c20000; --muted: #666666;
            --shadow-hard-sm: 2px 3px 0 rgba(34,34,34,.85);
            --font-title: 'Poppins', sans-serif;
            --font-hand: 'Gochi Hand', cursive;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: transparent; font-family: var(--font-title); color: var(--ink);
            min-height: 100%;
        }
        body {
            padding: 100px 100px 30px 0px;
            display: flex; flex-direction: column; justify-content: left;
            margin-left: 10px;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .view { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; }

        .page-kicker {
            display: inline-flex; align-items: center; gap: 10px;
            font-weight: 600; font-size: 10px; letter-spacing: .28em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
        }
        .page-kicker::before, .page-kicker::after {
            content: ''; width: 22px; height: 1.5px; background: currentColor;
        }
        .page-title { font-size: 38px; font-weight: 700; margin-bottom: 12px; letter-spacing: -.05em; line-height: 1.1; }
        .page-subtitle { font-family: var(--font-hand); font-size: 17px; color: var(--muted); margin-bottom: 24px; max-width: 500px; line-height: 1.4; }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 3fr);
            gap: 12px;
        }

        .tool-card {
            position: relative;
            aspect-ratio: 1 / 1;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 500;
            font-size: 15px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid rgba(34,34,34,0.06);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 12px 12px;
            gap: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition:
                transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s ease,
                border-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            animation: cardEnter 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 40%, var(--aura, #c20000) 0%, transparent 70%);
            opacity: 0.06;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .tool-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.10),
                0 8px 16px var(--aura-shadow, rgba(120,0,0,0.15));
            border-color: rgba(34,34,34,0.02);
        }
        .tool-card:hover::before { opacity: 0.16; }

        .tool-card:active {
            transform: translateY(-2px) scale(0.99);
        }

        .tool-card-art {
            width: 68%;
            max-width: 120px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
            filter: drop-shadow(0 8px 16px var(--aura-shadow, rgba(0,0,0,0.2)));
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tool-card:hover .tool-card-art {
            transform: scale(1.08) rotate(-2deg);
        }


/* width */
::-webkit-scrollbar {
width: 5px;
}

/* Track */
::-webkit-scrollbar-track {
background: #f1f1f12d;
}

/* Handle */
::-webkit-scrollbar-thumb {
background: #8888882a;
}

/* Handle on hover */
::-webkit-scrollbar-thumb:hover {
background: #555;
}

        @media(max-width: 1024px) {
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 3fr);
            gap: 12px;
        }
        body {
            padding: 100px 40px 30px 40px;
            display: flex; flex-direction: column; justify-content: center;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }
        
    }

        
    </style>
</head>
<body>

    <section class="view" id="page-tools">
        <span class="page-kicker">Explore</span>
        <h2 class="page-title">Laboratórios</h2>
        <p class="page-subtitle">Escolha uma habilidade para treinar hoje</p>
        <main class="tools-section">
            <div class="tools-grid" id="toolsGrid" aria-live="polite"></div>
    
            
                </a>
            </div>
        </main>

       
    </section>

    <script>
    const toolsData = [
            {
                title: 'Listening (ouvir)',
                link: '../../../pages/listening/',
                art: '../../../assets/listen.png',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Speaking (Falar)',
                link: '../../../pages/speaking/',
                art: '../../../assets/mars.png',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Writing (Escrever)',
                link: '../../../pages/writing/',
                art: '../../../assets/card2.png',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Reading (Ler)',
                link: '../../../pages/reading/',
                art: '../../../assets/card3.png',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            }
        
        ];

        const toolsGrid = document.getElementById('toolsGrid');

        toolsData.forEach((tool, i) => {
            const card = document.createElement('a');
            card.className = 'tool-card';
            card.href = tool.link;
            if (tool.external) {
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
            }
            card.style.setProperty('--aura', tool.color || '#c20000');
            card.style.setProperty('--aura-shadow', tool.auraShadow || 'rgba(120,0,0,0.35)');
            card.style.animationDelay = (i * 0.06) + 's';
            card.setAttribute('aria-label', 'Abrir ' + tool.title);

            const art = document.createElement('img');
            art.src = tool.art;
            art.alt = tool.title;
            art.className = 'tool-card-art';
            art.loading = 'lazy';

            const name = document.createElement('div');
            name.className = 'tool-card-name';
            name.textContent = tool.title;

            card.appendChild(art);
            card.appendChild(name);

            toolsGrid.appendChild(card);
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loaderScreen');
                if (loader) loader.classList.add('hidden');
            }, 350);
        });
        setTimeout(() => {
            const loader = document.getElementById('loaderScreen');
            if (loader && !loader.classList.contains('hidden')) loader.classList.add('hidden');
        }, 4000);
    </script>

</body>
</html>
