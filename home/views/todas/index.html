<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Metatags de Compartilhamento (Open Graph / WhatsApp / Twitter) -->
     <meta property="og:title" content="Language Lab">
     <meta property="og:description" content="Um laboratório, dezenas de maneiras de aprender.">
     <meta property="og:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
     <meta property="og:url" content="https://dididoingles.github.io/lab/">
     <meta property="og:type" content="website">
     
     <meta name="twitter:card" content="summary_large_image">
     <meta name="twitter:title" content="Language Lab">
     <meta name="twitter:description" content="Um laboratório, dezenas de maneiras de aprender.">
     <meta name="twitter:image" content="https://dididoingles.github.io/lab/assets/metalab.png">
 
     <!-- Favicon -->
     <link rel="icon" type="image/png" href="https://dididoingles.github.io/lab/assets/favilab.png">
     <link rel="apple-touch-icon" href="https://dididoingles.github.io/lab/assets/favilab.png">
    <title>Todas as ferramentas</title>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@100;200;300;400;600;700&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scrollbar-width: thin; scrollbar-color: rgba(34,34,34,0.22) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(34,34,34,0.22); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(34,34,34,0.45); }

        html, body { width: 100%; overflow-x: hidden; }
        body {
            background-color: #ffffff;
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.05em;
            min-height: 100vh;
            color: #222222;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           LOADER
           ============================================================ */
        .loader-screen {
            position: fixed; inset: 0; background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 24px; z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loader-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-text {
            font-family: 'Gochi Hand', cursive; letter-spacing: normal; font-size: 20px;
            color: #222222; opacity: 0; animation: loaderTextFade 0.8s ease-out 0.2s forwards;
            text-align: center; padding: 0 24px;
        }
        @keyframes loaderTextFade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 0.75; transform: translateY(0); }
        }
        .loader-spinner {
            width: 48px; height: 48px; border-radius: 50%;
            border: 3px solid rgba(194,0,0,0.15); border-top-color: #c20000;
            animation: spinnerRotate 0.9s linear infinite;
        }
        @keyframes spinnerRotate { to { transform: rotate(360deg); } }

        /* ============================================================
           TOPBAR
           ============================================================ */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; position: relative; z-index: 20;
        }
        .logo-title-row { display: flex; align-items: center; gap: 8px; }
        .logo-title {
            font-family: 'Poppins', sans-serif; font-weight: 700;
            letter-spacing: -0.05em; font-size: 22px; color: #c20000; line-height: 1;
        }
        .speech-balao { width: 30px; height: auto; }
        
        /* CORREÇÃO: z-index alto para ficar acima da aura do hero */
        .back-link {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            font-family: 'Gochi Hand', cursive;
            letter-spacing: normal;
            position:absolute;
            top: 20px;
            left: 10px;
            font-size: 15px;
            padding: 0 18px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #222222;
            text-decoration: none;
            min-height: 42px;
            background: #c20000;
            color: #fff;
            box-shadow: #222222;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
            
        }
        .back-link:hover {
            background: #a30000;
            transform: translate(1px, 1px);
            box-shadow: 1px 2px 0 rgba(34, 34, 34, 0.85);
        }
        .back-link svg {
            width: 13px; height: 13px;
            stroke: currentColor; stroke-width: 2;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }

        /* ============================================================
           HERO CURTO
           ============================================================ */
        .page-hero {
            position: relative;
            padding: 20px 20px 30px;
            text-align: center;
            overflow: hidden;
        }
        .page-hero::before {
            content: '';
            position: absolute;
            top: -60%; left: 50%;
            width: 80vmax; height: 80vmax;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(194,0,0,0.08) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: auraBreath 10s ease-in-out infinite;
        }
        @keyframes auraBreath {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.12); }
        }
        .page-hero > * { position: relative; z-index: 1; }

        .page-kicker {
            display: inline-flex; align-items: center; gap: 10px;
            margin-top: 60px;
            font-family: 'Poppins', sans-serif; font-weight: 600;
            font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
            color: #c20000; margin-bottom: 12px;
        }
        .page-kicker::before, .page-kicker::after {
            content: ''; width: 20px; height: 1px; background: currentColor;
        }
        .page-title {
            font-family: 'Poppins', sans-serif; font-weight: 700;
            font-size: 28px; color: #222222;
            letter-spacing: -0.05em; line-height: 1.1;
            margin-bottom: 10px;
        }
        .page-title .accent { color: #c20000; }
        .page-subtitle {
            font-family: 'Gochi Hand', cursive; letter-spacing: normal;
            font-size: 16px; color: #555555;
            max-width: 520px; margin: 0 auto;
            line-height: 1.4;
        }

        /* ============================================================
           GRID DE FERRAMENTAS
           ============================================================ */
        .tools-section {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 16px 40px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 640px) {
            .tools-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
        }
        @media (min-width: 900px) {
            .tools-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
        }

        /* CARD QUADRADINHO */
        .tool-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid rgba(34,34,34,0.06);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 12px 12px;
            gap: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition:
                transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s ease,
                border-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            animation: cardEnter 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Aura interna na cor do card */
        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 40%, var(--aura, #c20000) 0%, transparent 70%);
            opacity: 0.06;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .tool-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.10),
                0 8px 16px var(--aura-shadow, rgba(120,0,0,0.15));
            border-color: rgba(34,34,34,0.02);
        }
        .tool-card:hover::before { opacity: 0.16; }
        .tool-card:hover::after { transform: scaleX(1); }

        .tool-card:active {
            transform: translateY(-2px) scale(0.99);
        }

        .tool-card-art {
            width: 68%;
            max-width: 120px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
            filter: drop-shadow(0 8px 16px var(--aura-shadow, rgba(0,0,0,0.2)));
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tool-card:hover .tool-card-art {
            transform: scale(1.08) rotate(-2deg);
        }

        .tool-card-name {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #222222;
            letter-spacing: -0.03em;
            line-height: 1.15;
            text-align: center;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: auto;
            padding-bottom: 2px;
        }

        /* ============================================================
           BADGE "EXCLUSIVO"
           ============================================================ */
        .tool-card.exclusive {
            cursor: not-allowed;
        }
        .tool-card.exclusive::after {
            content: 'Em breve';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #c20000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 8px;
            letter-spacing: 0.12em;
            padding: 4px 7px;
            border-radius: 6px;
            z-index: 3;
            box-shadow: 0 2px 6px rgba(194, 0, 0, 0.35);
            pointer-events: none;
            transform: none;
        }
        .tool-card.exclusive .tool-card-art {
            filter: grayscale(0.35) drop-shadow(0 8px 16px var(--aura-shadow));
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        footer {
            width: 100%; text-align: center;
            padding: 32px 20px 28px;
            margin-top: auto;
        }
        .footer-text {
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.05em; font-weight: 400;
            font-size: 11px; color: #666666;
            line-height: 1.7;
        }
        .footer-link {
            color: #c20000; text-decoration: none; font-weight: 600;
            position: relative; transition: color 0.25s ease;
            white-space: nowrap;
        }
        .footer-link::after {
            content: ''; position: absolute; left: 0; bottom: -2px;
            width: 100%; height: 1px; background-color: currentColor;
            transform: scaleX(0); transform-origin: right;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-link:hover { color: #a30000; }
        .footer-link:hover::after { transform: scaleX(1); transform-origin: left; }

        .footer-ig {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 6px;
        }
        .footer-ig svg {
            width: 14px; height: 14px; stroke: currentColor;
            stroke-width: 2; fill: none;
        }

        /* ============================================================
           DESKTOP
           ============================================================ */
        @media (min-width: 768px) {
            .topbar { padding: 24px 60px; }
            .logo-title { font-size: 28px; }
            .speech-balao { width: 40px; }
            .back-link { font-size: 13px; padding: 8px 16px; }

            .page-hero { padding: 40px 40px 50px; }
            .page-title { font-size: 48px; }
            .page-subtitle { font-size: 20px; }
            .page-kicker {
            display: inline-flex; align-items: center; gap: 10px;
            margin-top: 50px;
            font-family: 'Poppins', sans-serif; font-weight: 600;
            font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
            color: #c20000; margin-bottom: 12px;
        }

            .tools-section { padding: 20px 60px 60px; }

            .tool-card {
                padding: 22px 16px 16px;
                gap: 12px;
                border-radius: 22px;
            }
            .tool-card-art { width: 64%; max-width: 150px; }
            .tool-card-name { font-size: 15px; }

            .tool-card.exclusive::after {
                font-size: 9px;
                padding: 5px 9px;
                top: 12px;
                right: 12px;
            }

            footer { padding: 50px 60px 40px; }
            .footer-text { font-size: 13px; }
            .footer-ig svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    
    <!-- CORREÇÃO: O </div> extra foi removido e o link está limpo -->
    <a href="../start/index.html" class="back-link" style="z-index: 50;">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Voltar
    </a>

    <section class="page-hero">
        <span class="page-kicker">Todas as ferramentas</span>
    </section>

    <section class="tools-section">
        <div class="tools-grid" id="toolsGrid"></div>
    </section>

    <footer>
        <p class="footer-text">
            Desenvolvido por· 
            <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer" class="footer-link">@dicarvalho.prof</a>
        </p>
        <p class="footer-text" style="margin-top:4px;">
            <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer" class="footer-link footer-ig">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                Seguir no Instagram
            </a>
        </p>
    </footer>

    <script>
        /* ============================================================
           DADOS DAS FERRAMENTAS
           ============================================================ */
        const toolsData = [
            {
                art: '../../../assets/mars.png', title: 'Praticar fala',
                description: 'Simule uma conversa em Inglês em diferentes situações.',
                link: 'https://dididoingles.github.io/marsroleplay/',
                color: '#c20000', auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                art: '../../../assets/card2.png', title: 'Treinar gramática',
                description: 'Treine suas habilidades em todos os tempos verbais',
                link: 'https://dididoingles.github.io/mysketchbook/',
                color: '#2b2b2b', auraShadow: 'rgba(15, 15, 15, 0.35)'
            },
            {
                art: '../../../assets/card3.png', title: 'Leitor Interativo',
                description: 'Aprenda a pronúncia de qualquer texto.',
                link: 'https://dididoingles.github.io/leitor/',
                color: '#c20000', auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                art: '../../../assets/listen.png', title: 'YouListen',
                description: 'Pratique sua compreensão com vídeos curtinhos do YouTube.',
                link: 'https://dididoingles.github.io/youlisten/',
                color: '#4a4a4a', auraShadow: 'rgba(35, 35, 35, 0.35)'
            },
            {
                art: '../../../assets/wheel.png', title: 'Conversation wheel',
                description: 'Uma roleta de temas de conversação em inglês com 3 níveis.',
                link: 'https://dididoingles.github.io/conversationwheel/',
                color: '#c20000', auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                art: '../../../assets/stop.png', title: 'Stop!',
                description: 'Um joguinho dinâmico de stop para estimular o vocabulário em Inglês.',
                link: 'https://dididoingles.github.io/stopgame/',
                color: '#5a5a5a', auraShadow: 'rgba(40, 40, 40, 0.35)'
            },
            {
                art: '../../../assets/card5.png', title: 'Você me conhece?',
                description: 'Versão em Inglês do famoso "Perguntados" para casais.',
                link: 'https://dididoingles.github.io/couples_trivia/',
                color: '#c20000', auraShadow: 'rgba(120, 0, 0, 0.35)',
            },
            {
                art: '../../../assets/7.webp', title: 'Airpaint Beta',
                description: 'Desenhe usando gestos das mãos via webcam.',
                link: 'https://dididoingles.github.io/airpaint/',
                color: '#5a5a5a', auraShadow: 'rgba(40, 40, 40, 0.35)',
            },

            {
                art: '../../../assets/card2.png', title: 'Ajudante de escrita',
                description: 'Desenhe usando gestos das mãos via webcam.',
                link: '#',
                color: '#5a5a5a', auraShadow: 'rgba(40, 40, 40, 0.35)',
                exclusive: true
            }
        ];

        /* ============================================================
           BUILD GRID
           ============================================================ */
        const toolsGrid = document.getElementById('toolsGrid');

        toolsData.forEach((tool, i) => {
            const card = document.createElement('a');
            card.className = 'tool-card' + (tool.exclusive ? ' exclusive' : '');
            card.href = tool.link;
            card.style.setProperty('--aura', tool.color);
            card.style.setProperty('--aura-shadow', tool.auraShadow);
            card.style.animationDelay = (i * 0.06) + 's';
            card.setAttribute('aria-label',
                (tool.exclusive ? 'Exclusivo para alunos: ' : 'Abrir ') + tool.title);

            if (tool.exclusive) {
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert(' Exclusivo para alunos da teacher @dicarvalho.prof.\n\nDisponível em breve!');
                });
            } else {
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
            }

            const art = document.createElement('img');
            art.src = tool.art;
            art.alt = tool.title;
            art.className = 'tool-card-art';
            art.loading = 'lazy';

            const name = document.createElement('div');
            name.className = 'tool-card-name';
            name.textContent = tool.title;

            card.appendChild(art);
            card.appendChild(name);

            toolsGrid.appendChild(card);
        });

        /* ============================================================
           LOADER
           ============================================================ */
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loaderScreen');
                if (loader) loader.classList.add('hidden');
            }, 400);
        });
        /* Segurança */
        setTimeout(() => {
            const loader = document.getElementById('loaderScreen');
            if (loader && !loader.classList.contains('hidden')) loader.classList.add('hidden');
        }, 4000);

        /* ============================================================
           BOTÃO VOLTAR (postMessage pro shell)
           ============================================================ */
           document.getElementById('btn-voltar').addEventListener('click', function(e) {
    e.preventDefault(); // <-- IMPEDE O IFRAME DE NAVEGAR SOZINHO
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ action: 'navigate', route: 'start' }, '*');
    }
});
    </script>
</body>
</html>
